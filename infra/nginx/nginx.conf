events { }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    autoindex off;

    server {
        listen 80;
        server_name localhost;

        location / {
            return 404;
        }

        location /files/G:/ {
            alias /mnt/g/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /files/D:/ {
            alias /mnt/d/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /files/E:/ {
            alias /mnt/e/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
