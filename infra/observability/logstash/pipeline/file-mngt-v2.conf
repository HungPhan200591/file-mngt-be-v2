input {
  file {
    path => [
      "/workspace/logs/root/*.json.log",
      "/workspace/logs/gateway/*.json.log",
      "/workspace/logs/catalog/*.json.log",
      "/workspace/logs/scan/*.json.log",
      "/workspace/logs/query/*.json.log",
      "/workspace/logs/media-worker/*.json.log"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/file-mngt-v2.sincedb"
    codec => json { ecs_compatibility => "v8" }
  }

  tcp {
    port => 5044
    codec => json_lines { ecs_compatibility => "v8" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
    data_stream_auto_routing => "false"
    data_stream_type => "logs"
    data_stream_dataset => "file_mngt_v2"
    data_stream_namespace => "local"
  }
}
