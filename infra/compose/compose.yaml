name: filemngt-infra

services:
  nginx-media:
    container_name: nginx-media
    image: nginx:${NGINX_MEDIA_VERSION:-1.30.4-alpine}
    ports:
      - "${NGINX_MEDIA_PORT:-18119}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - G:/:/mnt/g/:ro
      - D:/:/mnt/d/:ro
      - E:/:/mnt/e/:ro
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file_mngt_v2}
      POSTGRES_USER: ${POSTGRES_USER:-file_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "${POSTGRES_PORT:-18110}:5432"
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-file_user} -d ${POSTGRES_DB:-file_mngt_v2}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-volume-init:
    container_name: kafka-volume-init
    image: apache/kafka:3.9.0
    command: >
      sh -c "
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties --standalone;
        fi
      "
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-18111}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_PORT:-18111}:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-18121}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: backend-v2-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7.4.2-alpine
    ports:
      - "${REDIS_PORT:-18112}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.2.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-18113}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION:-9.2.5}
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: v8
    ports:
      - "${LOGSTASH_INPUT_PORT:-18115}:5044"
    volumes:
      - ../observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ../../logs:/workspace/logs/root:ro
      - ../../apps/gateway-service/logs:/workspace/logs/gateway:ro
      - ../../apps/catalog-service/logs:/workspace/logs/catalog:ro
      - ../../apps/scan-service/logs:/workspace/logs/scan:ro
      - ../../apps/query-service/logs:/workspace/logs/query:ro
      - ../../apps/media-worker/logs:/workspace/logs/media-worker:ro
      - logstash-data:/usr/share/logstash/data
    restart: unless-stopped

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.2.5}
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-18114}:5601"
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PROMETHEUS_PORT:-18116}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.0}
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-18117}:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  swagger-ui:
    container_name: swagger-ui
    image: swaggerapi/swagger-ui:${SWAGGER_UI_VERSION:-v5.18.2}
    ports:
      - "${SWAGGER_UI_PORT:-18118}:8080"
    volumes:
      - ../../docs/contracts/openapi:/usr/share/nginx/html/openapi:ro
    environment:
      URLS: "[{url: '/openapi/catalog-v1.yaml', name: 'Catalog API'}, {url: '/openapi/scan-v1.yaml', name: 'Scan API'}, {url: '/openapi/query-v1.yaml', name: 'Query API'}, {url: '/openapi/media-delivery-v1.yaml', name: 'Media Delivery API'}]"
    restart: unless-stopped

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:${JAEGER_VERSION:-1.60.0}
    ports:
      - "${JAEGER_UI_PORT:-18122}:16686"
      - "${JAEGER_OTLP_PORT:-18123}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-18124}:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  elasticsearch-data:
  logstash-data:
  prometheus-data:
  grafana-data:
