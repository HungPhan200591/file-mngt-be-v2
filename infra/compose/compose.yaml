services:
  nginx-media:
    image: nginx:${NGINX_MEDIA_VERSION:-1.30.4-alpine}
    ports:
      - "${NGINX_MEDIA_PORT:-18119}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - G:/:/mnt/g/:ro
      - D:/:/mnt/d/:ro
      - E:/:/mnt/e/:ro
    restart: unless-stopped

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-platform-admin}
      POSTGRES_DB: postgres
      CATALOG_DB: ${CATALOG_DB:-catalog_db}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-change-me-catalog}
      SCAN_DB: ${SCAN_DB:-scan_db}
      SCAN_DB_USER: ${SCAN_DB_USER:-scan_user}
      SCAN_DB_PASSWORD: ${SCAN_DB_PASSWORD:-change-me-scan}
      QUERY_DB: ${QUERY_DB:-query_db}
      QUERY_DB_USER: ${QUERY_DB_USER:-query_user}
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:-change-me-query}
    ports:
      - "${POSTGRES_PORT:-18110}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-volume-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - mkdir -p /tmp/kraft-combined-logs && chown -R 1000:1000 /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-18111}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_PORT:-18111}:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-18120}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: backend-v2-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "${REDIS_PORT:-18112}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.2.5}
    profiles: ["search", "observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-18113}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION:-9.2.5}
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: v8
    ports:
      - "${LOGSTASH_INPUT_PORT:-18115}:5044"
    volumes:
      - ../observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ../../logs:/workspace/logs/root:ro
      - ../../apps/gateway-service/logs:/workspace/logs/gateway:ro
      - ../../apps/catalog-service/logs:/workspace/logs/catalog:ro
      - ../../apps/scan-service/logs:/workspace/logs/scan:ro
      - ../../apps/query-service/logs:/workspace/logs/query:ro
      - ../../apps/media-worker/logs:/workspace/logs/media-worker:ro
      - logstash-data:/usr/share/logstash/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.2.5}
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-18114}:5601"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PROMETHEUS_PORT:-18116}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.0}
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-18117}:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  swagger-ui:
    image: swaggerapi/swagger-ui:${SWAGGER_UI_VERSION:-v5.18.2}
    ports:
      - "${SWAGGER_UI_PORT:-18118}:8080"
    volumes:
      - ../../docs/contracts/openapi:/usr/share/nginx/html/openapi:ro
    environment:
      URLS: "[{url: '/openapi/catalog-v1.yaml', name: 'Catalog API'}, {url: '/openapi/scan-v1.yaml', name: 'Scan API'}, {url: '/openapi/query-v1.yaml', name: 'Query API'}, {url: '/openapi/media-delivery-v1.yaml', name: 'Media Delivery API'}]"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  elasticsearch-data:
  logstash-data:
  prometheus-data:
  grafana-data:
