<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đang mở Docsify…</title>
    <script>
      (() => {
        const basePath = '/file_mngt_microservice/';
        const path = window.location.pathname;
        const route = path.startsWith(basePath) ? path.slice(basePath.length) : '';
        window.location.replace(`${basePath}#/${route}${window.location.search}`);
      })();
    </script>
  </head>
  <body>Đang chuyển đến trang tài liệu…</body>
</html>
