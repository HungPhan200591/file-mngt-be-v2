spring:
  application:
    name: gateway-service
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-subjects
              uri: ${CATALOG_SERVICE_URL:http://localhost:18101}
              predicates:
                - Path=/api/v2/catalog/subjects,/api/v2/catalog/subjects/**
            - id: scan-api
              uri: ${SCAN_SERVICE_URL:http://localhost:18102}
              predicates:
                - Path=/api/v2/scans/**
            - id: query-subjects
              uri: ${QUERY_SERVICE_URL:http://localhost:18103}
              predicates:
                - Path=/api/v2/query/subjects,/api/v2/query/subjects/**
            - id: media-content
              uri: ${MEDIA_WORKER_SERVICE_URL:http://localhost:18104}
              predicates:
                - Path=/api/v2/media/subjects/**

gateway:
  http-client:
    connect-timeout: 1s
    read-timeout: 30s

observability:
  http-correlation:
    enabled: false

server:
  port: ${GATEWAY_SERVER_PORT:18100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/gateway-service.json.log}
  structured:
    format:
      file: ecs
