spring:
  application:
    name: gateway-service
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-subjects
              uri: ${CATALOG_SERVICE_URL:http://localhost:18101}
              predicates:
                - Path=/api/v2/catalog/subjects,/api/v2/catalog/subjects/**
            - id: scan-api
              uri: ${SCAN_SERVICE_URL:http://localhost:18102}
              predicates:
                - Path=/api/v2/scans/**
            - id: query-subjects
              uri: ${QUERY_SERVICE_URL:http://localhost:18103}
              predicates:
                - Path=/api/v2/query/subjects,/api/v2/query/subjects/**

gateway:
  http-client:
    connect-timeout: 1s
    read-timeout: 30s

server:
  port: ${GATEWAY_SERVER_PORT:18100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
