spring:
  application:
    name: gateway-service
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-subjects
              uri: ${CATALOG_SERVICE_URL:http://localhost:18101}
              predicates:
                - Path=/api/v2/catalog/subjects,/api/v2/catalog/subjects/**
            - id: scan-api
              uri: ${SCAN_SERVICE_URL:http://localhost:18102}
              predicates:
                - Path=/api/v2/scans/**
            - id: query-subjects
              uri: ${QUERY_SERVICE_URL:http://localhost:18103}
              predicates:
                - Path=/api/v2/query/subjects,/api/v2/query/subjects/**

gateway:
  http-client:
    connect-timeout: 1s
    read-timeout: 30s

observability:
  http-correlation:
    enabled: false

server:
  port: ${GATEWAY_SERVER_PORT:18100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/gateway-service.json.log}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO_CORR}] %-5level %logger{36} - %msg%n"
  structured:
    format:
      file: ecs
