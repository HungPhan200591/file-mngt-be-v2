spring:
  application:
    name: media-worker
  profiles:
    default: local

server:
  port: ${MEDIA_WORKER_SERVER_PORT:18104}

media:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:18101}
    connect-timeout: ${MEDIA_CATALOG_CONNECT_TIMEOUT:1s}
    read-timeout: ${MEDIA_CATALOG_READ_TIMEOUT:5s}
  roots: []

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
