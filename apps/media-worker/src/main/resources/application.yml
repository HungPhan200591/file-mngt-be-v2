spring:
  application:
    name: media-worker
  profiles:
    default: local

server:
  port: -1

management:
  server:
    port: ${MEDIA_WORKER_MANAGEMENT_PORT:18104}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
