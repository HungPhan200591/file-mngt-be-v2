spring:
  application:
    name: media-worker
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    default: local

server:
  port: ${MEDIA_WORKER_SERVER_PORT:18104}

media:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:18101}
    connect-timeout: ${MEDIA_CATALOG_CONNECT_TIMEOUT:1s}
    read-timeout: ${MEDIA_CATALOG_READ_TIMEOUT:5s}
  roots: []

p6spy:
  enabled: ${P6SPY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/media-worker.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
