spring:
  application:
    name: catalog-service
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    default: local
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:18110/catalog_db}
    username: ${CATALOG_DATASOURCE_USERNAME:catalog_user}
    password: ${CATALOG_DATASOURCE_PASSWORD:change-me-catalog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

catalog:
  outbox:
    enabled: ${CATALOG_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${CATALOG_OUTBOX_FIXED_DELAY_MS:50}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:500}
    instance-id: ${CATALOG_OUTBOX_INSTANCE_ID:${HOSTNAME:catalog-publisher}}
  kafka:
    consumer:
      enabled: ${CATALOG_KAFKA_CONSUMER_ENABLED:true}
    dlt-observer:
      enabled: ${CATALOG_KAFKA_DLT_OBSERVER_ENABLED:true}

p6spy:
  enabled: ${P6SPY_ENABLED:true}

server:
  port: ${CATALOG_SERVER_PORT:18101}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/catalog-service.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
