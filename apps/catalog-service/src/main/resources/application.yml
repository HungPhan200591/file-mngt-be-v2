spring:
  application:
    name: catalog-service
  profiles:
    default: local
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:18110/catalog_db}
    username: ${CATALOG_DATASOURCE_USERNAME:catalog_user}
    password: ${CATALOG_DATASOURCE_PASSWORD:change-me-catalog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

catalog:
  outbox:
    enabled: ${CATALOG_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${CATALOG_OUTBOX_FIXED_DELAY_MS:1000}
  kafka:
    consumer:
      enabled: ${CATALOG_KAFKA_CONSUMER_ENABLED:true}
    dlt-observer:
      enabled: ${CATALOG_KAFKA_DLT_OBSERVER_ENABLED:true}

server:
  port: ${CATALOG_SERVER_PORT:18101}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/catalog-service.json.log}
  structured:
    format:
      file: ecs
