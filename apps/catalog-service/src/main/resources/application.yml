spring:
  application:
    name: catalog-service
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    default: local
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:18110/catalog_db}
    username: ${CATALOG_DATASOURCE_USERNAME:catalog_user}
    password: ${CATALOG_DATASOURCE_PASSWORD:change-me-catalog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.records: ${CATALOG_OPERATION_MAX_POLL_RECORDS:2000}
        max.partition.fetch.bytes: ${CATALOG_OPERATION_MAX_POLL_BYTES:16777216}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

catalog:
  outbox:
    enabled: ${CATALOG_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${CATALOG_OUTBOX_FIXED_DELAY_MS:50}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:500}
    instance-id: ${CATALOG_OUTBOX_INSTANCE_ID:${HOSTNAME:catalog-publisher}}
    operation-relay:
      enabled: ${CATALOG_OUTBOX_OPERATION_RELAY_ENABLED:false}
      lane-count: 64
      worker-count: ${CATALOG_OUTBOX_OPERATION_RELAY_WORKERS:4}
      fetch-size: ${CATALOG_OUTBOX_OPERATION_RELAY_FETCH_SIZE:2000}
      max-in-flight: ${CATALOG_OUTBOX_OPERATION_RELAY_MAX_IN_FLIGHT:500}
      lease-seconds: ${CATALOG_OUTBOX_OPERATION_RELAY_LEASE_SECONDS:30}
      idle-backoff-millis: ${CATALOG_OUTBOX_OPERATION_RELAY_IDLE_BACKOFF_MS:5}
      maximum-failure-backoff-millis: ${CATALOG_OUTBOX_OPERATION_RELAY_MAX_FAILURE_BACKOFF_MS:5000}
      scheduler-delay-ms: ${CATALOG_OUTBOX_OPERATION_RELAY_DELAY_MS:1}
      instance-id: ${CATALOG_OUTBOX_OPERATION_RELAY_INSTANCE_ID:${HOSTNAME:catalog-operation-relay}}
      pause-threshold: ${CATALOG_OUTBOX_OPERATION_RELAY_PAUSE_THRESHOLD:100000}
      resume-threshold: ${CATALOG_OUTBOX_OPERATION_RELAY_RESUME_THRESHOLD:50000}
      pressure-sample-ms: ${CATALOG_OUTBOX_OPERATION_RELAY_PRESSURE_SAMPLE_MS:1000}
  operation:
    finalizer-enabled: ${CATALOG_OPERATION_FINALIZER_ENABLED:false}
    seal-enabled: ${CATALOG_OPERATION_SEAL_ENABLED:true}
    instance-id: ${CATALOG_OPERATION_INSTANCE_ID:${HOSTNAME:catalog-finalizer}}
    worker-count: ${CATALOG_OPERATION_WORKER_COUNT:4}
    reconcile-unit-count: ${CATALOG_OPERATION_RECONCILE_UNIT_COUNT:16}
    seal-batch-size: ${CATALOG_OPERATION_SEAL_BATCH_SIZE:8}
    seal-delay-ms: ${CATALOG_OPERATION_SEAL_DELAY_MS:10}
    subject-page-size: ${CATALOG_OPERATION_SUBJECT_PAGE_SIZE:500}
    lease-seconds: ${CATALOG_OPERATION_LEASE_SECONDS:30}
    statement-timeout-ms: ${CATALOG_OPERATION_STATEMENT_TIMEOUT_MS:20000}
    maximum-unit-attempts: ${CATALOG_OPERATION_MAXIMUM_UNIT_ATTEMPTS:3}
    finalizer-delay-ms: ${CATALOG_OPERATION_FINALIZER_DELAY_MS:10}
    maximum-snapshot-bytes: ${CATALOG_OPERATION_MAXIMUM_SNAPSHOT_BYTES:921600}
    watchdog-enabled: ${CATALOG_OPERATION_WATCHDOG_ENABLED:true}
    watchdog-delay-ms: ${CATALOG_OPERATION_WATCHDOG_DELAY_MS:1000}
  kafka:
    operation-consumer:
      enabled: ${CATALOG_OPERATION_CONSUMER_ENABLED:false}
      topic-provisioning-enabled: ${CATALOG_OPERATION_TOPIC_PROVISIONING_ENABLED:true}
      topic-partitions: ${CATALOG_OPERATION_TOPIC_PARTITIONS:12}
      max-poll-records: ${CATALOG_OPERATION_MAX_POLL_RECORDS:2000}
      max-poll-bytes: ${CATALOG_OPERATION_MAX_POLL_BYTES:16777216}
      slice-records: ${CATALOG_OPERATION_SLICE_RECORDS:2000}
      slice-bytes: ${CATALOG_OPERATION_SLICE_BYTES:16777216}
      concurrency: ${CATALOG_OPERATION_CONSUMER_CONCURRENCY:4}
    consumer:
      enabled: ${CATALOG_KAFKA_CONSUMER_ENABLED:true}
      concurrency: ${CATALOG_KAFKA_CONSUMER_CONCURRENCY:8}
    dlt-observer:
      enabled: ${CATALOG_KAFKA_DLT_OBSERVER_ENABLED:true}

p6spy:
  enabled: ${P6SPY_ENABLED:true}

server:
  port: ${CATALOG_SERVER_PORT:18101}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/catalog-service.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
