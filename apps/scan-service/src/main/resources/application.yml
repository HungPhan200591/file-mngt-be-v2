spring:
  application:
    name: scan-service
  threads:
    virtual:
      enabled: ${SCAN_VIRTUAL_THREADS_ENABLED:false}
  profiles:
    default: local
  datasource:
    url: ${SCAN_DATASOURCE_URL:jdbc:postgresql://localhost:18110/scan_db}
    username: ${SCAN_DATASOURCE_USERNAME:scan_user}
    password: ${SCAN_DATASOURCE_PASSWORD:change-me-scan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true

scan:
  roots: []

server:
  port: ${SCAN_SERVER_PORT:18102}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/scan-service.json.log}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO_CORR}] %-5level %logger{36} - %msg%n"
  structured:
    format:
      file: ecs
