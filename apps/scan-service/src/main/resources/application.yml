spring:
  application:
    name: scan-service
  profiles:
    default: local
  datasource:
    url: ${SCAN_DATASOURCE_URL:jdbc:postgresql://localhost:18110/scan_db}
    username: ${SCAN_DATASOURCE_USERNAME:scan_user}
    password: ${SCAN_DATASOURCE_PASSWORD:change-me-scan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

scan:
  roots: []

server:
  port: ${SCAN_SERVER_PORT:18102}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
