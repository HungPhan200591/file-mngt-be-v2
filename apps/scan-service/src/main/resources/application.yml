spring:
  application:
    name: scan-service
  output:
    ansi:
      enabled: ALWAYS
  threads:
    virtual:
      enabled: ${SCAN_VIRTUAL_THREADS_ENABLED:true}
  profiles:
    default: local
  datasource:
    url: ${SCAN_DATASOURCE_URL:jdbc:postgresql://localhost:18110/scan_db?reWriteBatchedInserts=true}
    username: ${SCAN_DATASOURCE_USERNAME:scan_user}
    password: ${SCAN_DATASOURCE_PASSWORD:change-me-scan}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true

scan:
  approval-operation:
    enabled: ${SCAN_APPROVAL_OPERATION_ENABLED:true}
    fixed-delay-ms: ${SCAN_APPROVAL_OPERATION_FIXED_DELAY_MS:250}
    chunk-size: ${SCAN_APPROVAL_OPERATION_CHUNK_SIZE:25000}
    jdbc-batch-size: ${SCAN_APPROVAL_OPERATION_JDBC_BATCH_SIZE:500}
    copy-enabled: ${SCAN_APPROVAL_OPERATION_COPY_ENABLED:true}
    preparation-parallelism: ${SCAN_APPROVAL_OPERATION_PREPARATION_PARALLELISM:4}
    lease-seconds: ${SCAN_APPROVAL_OPERATION_LEASE_SECONDS:30}
    max-attempts: ${SCAN_APPROVAL_OPERATION_MAX_ATTEMPTS:5}
    total-deadline-seconds: ${SCAN_APPROVAL_OPERATION_TOTAL_DEADLINE_SECONDS:120}
  outbox:
    enabled: ${SCAN_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${SCAN_OUTBOX_FIXED_DELAY_MS:50}
    batch-size: ${SCAN_OUTBOX_BATCH_SIZE:500}
    instance-id: ${SCAN_OUTBOX_INSTANCE_ID:${HOSTNAME:scan-publisher}}
  lease-duration-seconds: ${SCAN_LEASE_DURATION_SECONDS:60}
  reconciliation-statement-timeout-seconds: ${SCAN_RECONCILIATION_STATEMENT_TIMEOUT_SECONDS:30}
  mutation-statement-timeout-seconds: ${SCAN_MUTATION_STATEMENT_TIMEOUT_SECONDS:45}
  lock-timeout-seconds: ${SCAN_LOCK_TIMEOUT_SECONDS:5}
  business-chunk-size: ${SCAN_BUSINESS_CHUNK_SIZE:100000}
  reconciliation-parallelism: ${SCAN_RECONCILIATION_PARALLELISM:8}
  reconciliation-pipeline-enabled: ${SCAN_RECONCILIATION_PIPELINE_ENABLED:true}
  reconciliation-pipeline-queue-capacity: ${SCAN_RECONCILIATION_PIPELINE_QUEUE_CAPACITY:1}
  review-projection:
    enabled: ${SCAN_REVIEW_PROJECTION_ENABLED:true}
    fixed-delay-ms: ${SCAN_REVIEW_PROJECTION_FIXED_DELAY_MS:1000}
    statement-timeout-seconds: ${SCAN_REVIEW_PROJECTION_STATEMENT_TIMEOUT_SECONDS:45}
    lease-seconds: ${SCAN_REVIEW_PROJECTION_LEASE_SECONDS:90}
    max-attempts: ${SCAN_REVIEW_PROJECTION_MAX_ATTEMPTS:5}
    total-deadline-seconds: ${SCAN_REVIEW_PROJECTION_TOTAL_DEADLINE_SECONDS:1800}
    decision-batch-size: ${SCAN_REVIEW_PROJECTION_DECISION_BATCH_SIZE:500}
  sse:
    heartbeat-seconds: ${SCAN_SSE_HEARTBEAT_SECONDS:15}
    connection-lifetime-seconds: ${SCAN_SSE_CONNECTION_LIFETIME_SECONDS:300}
    max-connections-per-run: ${SCAN_SSE_MAX_CONNECTIONS_PER_RUN:5}
    max-connections: ${SCAN_SSE_MAX_CONNECTIONS:100}
    progress-interval-millis: ${SCAN_SSE_PROGRESS_INTERVAL_MILLIS:1000}
  roots:
    - key: fixture-media-delivery
      path: D:/Personal/file-management/v2/file-mngt-be-v2/tests/fixtures/scan/media-delivery
      profile: JOKE_VIDEO
    - key: fixture-joke-video
      path: D:/Personal/file-management/v2/file-mngt-be-v2/tests/fixtures/scan/joke-video
      profile: JOKE_VIDEO
    - key: root
      path: G:/System/Root
      profile: JOKE_VIDEO
    - key: syncdroid
      path: G:/System/Syncdroid
      profile: USE_VIDEO
    - key: album
      path: G:/System/Album
      profile: USE_ALBUM
    - key: honeyview
      path: G:/System/Honeyview
      profile: USE_ASSET
    - key: landscape
      path: G:/System/Honeyview/Landscape
      profile: USE_ASSET
    - key: portrait
      path: G:/System/Honeyview/Portrait
      profile: USE_ASSET
    - key: fullpics
      path: G:/System/FullPics
      profile: USE_ASSET
    - key: cover-pics
      path: G:/System/Cover/Pics
      profile: JOKE_ASSET
    - key: gif-joke
      path: G:/System/Gif/Joke
      profile: JOKE_ASSET
    - key: gif-use
      path: G:/System/Gif/Use
      profile: USE_ASSET
    - key: manhwa
      path: G:/System/ComicEd/Manhwa
      profile: USE_ALBUM

catalog:
  registry:
    base-url: ${CATALOG_BASE_URL:http://localhost:18101}
    timeout-ms: ${CATALOG_REGISTRY_TIMEOUT_MS:3000}
    existence-timeout-ms: ${CATALOG_EXISTENCE_TIMEOUT_MS:3000}

p6spy:
  enabled: ${P6SPY_ENABLED:false}

server:
  port: ${SCAN_SERVER_PORT:18102}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    com.filemngt.v2: ${LOGGING_LEVEL_COM_FILEMNGT:DEBUG}
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/scan-service.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
