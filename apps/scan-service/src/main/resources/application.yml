spring:
  application:
    name: scan-service
  output:
    ansi:
      enabled: ALWAYS
  threads:
    virtual:
      enabled: ${SCAN_VIRTUAL_THREADS_ENABLED:true}
  profiles:
    default: local
  datasource:
    url: ${SCAN_DATASOURCE_URL:jdbc:postgresql://localhost:18110/scan_db?reWriteBatchedInserts=true}
    username: ${SCAN_DATASOURCE_USERNAME:scan_user}
    password: ${SCAN_DATASOURCE_PASSWORD:change-me-scan}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true

scan:
  lease-duration-seconds: ${SCAN_LEASE_DURATION_SECONDS:60}
  reconciliation-statement-timeout-seconds: ${SCAN_RECONCILIATION_STATEMENT_TIMEOUT_SECONDS:30}
  mutation-statement-timeout-seconds: ${SCAN_MUTATION_STATEMENT_TIMEOUT_SECONDS:45}
  lock-timeout-seconds: ${SCAN_LOCK_TIMEOUT_SECONDS:5}
  roots: []

p6spy:
  enabled: ${P6SPY_ENABLED:false}

server:
  port: ${SCAN_SERVER_PORT:18102}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    com.filemngt.v2: ${LOGGING_LEVEL_COM_FILEMNGT:DEBUG}
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/scan-service.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
