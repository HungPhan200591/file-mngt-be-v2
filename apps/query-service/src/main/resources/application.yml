spring:
  application:
    name: query-service
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    default: local
  datasource:
    url: ${QUERY_DATASOURCE_URL:jdbc:postgresql://localhost:18110/query_db}
    username: ${QUERY_DATASOURCE_USERNAME:query_user}
    password: ${QUERY_DATASOURCE_PASSWORD:change-me-query}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:18111}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      observation-enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:18113}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18112}
      connect-timeout: ${QUERY_DETAIL_CACHE_CONNECT_TIMEOUT:500ms}
      timeout: ${QUERY_DETAIL_CACHE_COMMAND_TIMEOUT:500ms}

query:
  media:
    public-base-url: ${QUERY_MEDIA_PUBLIC_BASE_URL:http://localhost:18119}
    root-paths: ${QUERY_MEDIA_ROOT_PATHS:root=/files/G:/System/Root;cover-pics=/files/G:/System/Cover/Pics;syncdroid=/files/G:/System/Syncdroid;album=/files/G:/System/Album;honeyview=/files/G:/System/Honeyview;landscape=/files/G:/System/Honeyview/Landscape;portrait=/files/G:/System/Honeyview/Portrait;fullpics=/files/G:/System/FullPics;gif-joke=/files/G:/System/Gif/Joke;gif-use=/files/G:/System/Gif/Use;manhwa=/files/G:/System/ComicEd/Manhwa;fixture-media-delivery=/files/D:/Personal/file-management/v2/file-mngt-be-v2/tests/fixtures/scan/media-delivery;fixture-joke-video=/files/D:/Personal/file-management/v2/file-mngt-be-v2/tests/fixtures/scan/joke-video}
  detail-cache:
    enabled: ${QUERY_DETAIL_CACHE_ENABLED:true}
    ttl: ${QUERY_DETAIL_CACHE_TTL:10m}
  search:
    enabled: ${QUERY_SEARCH_ENABLED:true}
    publisher-enabled: ${QUERY_SEARCH_PUBLISHER_ENABLED:true}
    publish-delay: ${QUERY_SEARCH_PUBLISH_DELAY:1000}
    retry-initial-delay: ${QUERY_SEARCH_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${QUERY_SEARCH_RETRY_MAX_DELAY:5m}
    rebuild-batch-size: ${QUERY_SEARCH_REBUILD_BATCH_SIZE:500}
  kafka:
    consumer:
      enabled: ${QUERY_KAFKA_CONSUMER_ENABLED:true}

p6spy:
  enabled: ${P6SPY_ENABLED:true}

server:
  port: ${QUERY_SERVER_PORT:18103}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:18124/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  file:
    name: ${OBSERVABILITY_LOG_FILE:logs/query-service.json.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr([%X{correlationId:-NO_CORR}]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  structured:
    format:
      file: ecs
