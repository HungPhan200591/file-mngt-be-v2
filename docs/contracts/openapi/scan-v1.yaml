openapi: 3.1.1
info:
  title: Scan Service API
  version: v1
  description: Read-only filesystem scan preview for Backend V2.
security: []
servers:
  - url: http://localhost:18100
    description: Local V2 Gateway (Routed)
  - url: http://localhost:18102
    description: Local Scan theo ADR-004
paths:
  /api/v2/scans:
    get:
      operationId: listRecentScanRuns
      summary: List recent scan runs
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Recent scan runs page
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScanRun'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
  /api/v2/scans/roots:
    get:
      operationId: listScanRoots
      summary: List configured scan roots without filesystem paths
      responses:
        '200':
          description: Configured roots safe for browser selection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanRoot'
  /api/v2/scans/previews:
    post:
      operationId: startScanPreview
      summary: Start a configured root scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScanRequest'
      responses:
        '202':
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRun'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/ScanStartUnavailableProblem'
  /api/v2/scans/review-queue:
    get:
      operationId: listScanReviewQueue
      summary: List pending, rejected or approved current proposals across completed scan runs
      parameters:
        - $ref: '#/components/parameters/ReviewQueueState'
        - $ref: '#/components/parameters/RootKey'
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of review queue proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueProposalPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/v2/scans/review-queue/issues:
    get:
      operationId: listCompletedScanIssueHistory
      summary: List issue history across completed scan runs
      parameters:
        - $ref: '#/components/parameters/RootKey'
        - name: code
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of issues found in completed scan runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueIssuePage'
  /api/v2/scans/review-queue/decisions:
    post:
      operationId: decideScanReviewQueue
      summary: Apply one decision to all pending review queue proposals matching filters
      parameters:
        - $ref: '#/components/parameters/RootKey'
        - name: search
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [PENDING], default: PENDING }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanProposalDecisionRequest'
      responses:
        '200':
          description: Number of proposals decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDecisionResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/v2/scans/review-queue/reopen:
    post:
      operationId: reopenAllRejectedScanProposals
      summary: Reopen all rejected review queue proposals matching filters
      parameters:
        - $ref: '#/components/parameters/RootKey'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Number of rejected proposals reopened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDecisionResponse'
  /api/v2/scans/{scanId}:
    get:
      operationId: getScanRun
      summary: Get scan run summary
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Scan run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRun'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v2/scans/{scanId}/events:
    get:
      operationId: streamScanRunEvents
      summary: Stream scan run snapshot, progress and terminal state
      description: |
        Additive SSE stream. The first data frame is `scan.snapshot.v1`, progress
        frames are best-effort and may be coalesced, and `scan.terminal.v1` closes
        the stream. Heartbeats are SSE comments. The server does not provide
        Last-Event-ID replay; reconnect receives a new authoritative snapshot.
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: |
            Server-Sent Events named `scan.snapshot.v1`, `scan.progress.v1` and
            `scan.terminal.v1`, each carrying `ScanRunStreamEvent` JSON data.
          headers:
            Cache-Control:
              schema: { type: string }
              description: `no-cache` for the open event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ScanRunStreamEvent'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '429':
          $ref: '#/components/responses/StreamCapacityProblem'
  /api/v2/scans/{scanId}/proposals:
    get:
      operationId: listScanProposals
      summary: List proposals of a scan run
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: search
          in: query
          schema: { type: string }
        - name: decision
          in: query
          schema: { type: string, enum: [PENDING, APPROVE, REJECT] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanProposalPage'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v2/scans/{scanId}/issues:
    get:
      operationId: listScanIssues
      summary: List issues of a scan run
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: search
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanIssuePage'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v2/scans/{scanId}/proposals/{proposalId}/decision:
    post:
      operationId: decideScanProposal
      summary: Approve or reject a scan proposal
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanProposalDecisionRequest'
      responses:
        '200':
          description: Existing or newly persisted decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanProposalDecision'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/v2/scans/review-queue/decision-jobs:
    post:
      operationId: enqueueScanBulkDecision
      summary: Enqueue a durable bounded bulk decision job
      parameters:
        - { name: rootKey, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: scanId, in: query, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '202':
          description: Durable job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDecisionAccepted' }
  /api/v2/scans/review-queue/reopen-jobs:
    post:
      operationId: enqueueScanBulkReopen
      summary: Enqueue a durable bounded bulk reopen job
      parameters:
        - { name: rootKey, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: scanId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Durable job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDecisionAccepted' }
  /api/v2/scans/review-queue/decision-jobs/{jobId}:
    get:
      operationId: getScanBulkDecisionJob
      summary: Get durable bulk decision job status
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Durable job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanAsyncJobStatus' }
  /api/v2/scans/issues/{issueId}/recheck:
    post:
      operationId: requestScanIssueRecheck
      summary: Request an asynchronous targeted recheck for one historical issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Durable recheck job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueRecheckAccepted'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v2/scans/issues/recheck-jobs/{jobId}:
    get:
      operationId: getScanIssueRecheckJob
      summary: Get durable issue recheck job status
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Durable job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanAsyncJobStatus' }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v2/scans/{scanId}/proposals/{proposalId}/reopen:
    post:
      operationId: reopenRejectedScanProposal
      summary: Reopen a rejected scan proposal
      description: |
        Sets the desired state to PENDING. A rejected decision is deleted; an
        already pending proposal is a successful no-op. An approved proposal
        cannot be reopened because approval may already have reached Catalog.
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '204':
          description: Proposal is pending for review
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
components:
  parameters:
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RootKey:
      name: rootKey
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 100 }
    ReviewQueueState:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [PENDING, REJECTED, APPROVED], default: PENDING }
  responses:
    ValidationProblem:
      description: Invalid root key or request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ConflictProblem:
      description: Request conflicts with existing Scan state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFoundProblem:
      description: Scan run does not exist
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ScanStartUnavailableProblem:
      description: Configured scan root or required Catalog registry is unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          examples:
            scanRootUnavailable:
              value:
                type: urn:filemngt:problem:scan-root-unavailable
                title: Scan root unavailable
                status: 503
                detail: 'Configured scan root is unavailable: one-million-joke-video'
                instance: /api/v2/scans/previews
    StreamCapacityProblem:
      description: Scan event stream connection capacity has been reached
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    StartScanRequest:
      type: object
      required: [rootKey]
      properties:
        rootKey: { type: string, minLength: 1, maxLength: 100 }
        overwriteExisting:
          type: boolean
          default: false
          description: Reparse every current file and retain proposals for assets already present in Catalog
    ScanRoot:
      type: object
      required: [key, profile]
      properties:
        key: { type: string }
        profile: { $ref: '#/components/schemas/ScanProfile' }
    ScanRun:
      type: object
      required: [id, rootKey, profile, status, startedAt, scannedFileCount, proposalCount, issueCount]
      properties:
        id: { type: string, format: uuid }
        rootKey: { type: string }
        profile: { $ref: '#/components/schemas/ScanProfile' }
        status: { $ref: '#/components/schemas/ScanRunStatus' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        scannedFileCount: { type: integer, format: int64 }
        proposalCount: { type: integer, format: int64 }
        issueCount: { type: integer, format: int64 }
        changedFileCount:
          type: [integer, 'null']
          format: int64
          description: Exact changed-file workload persisted after staging diff.
        reconciledFileCount:
          type: [integer, 'null']
          format: int64
          description: Changed files whose reconciliation checkpoint has committed.
        lastError: { type: [string, 'null'] }
        reviewSummary:
          oneOf:
            - $ref: '#/components/schemas/ReviewQueueSummary'
            - type: 'null'
          description: Current worklist counters for this run's root; available on detail reads.
    ReviewQueueSummary:
      type: object
      required: [pendingCount, rejectedCount, approvedCount, issueCount]
      properties:
        pendingCount: { type: integer, format: int64 }
        rejectedCount: { type: integer, format: int64 }
        approvedCount: { type: integer, format: int64 }
        issueCount: { type: integer, format: int64 }
    ScanRunStreamEvent:
      type: object
      required:
        - schemaVersion
        - eventType
        - scanId
        - emittedAt
        - phase
        - status
        - observedFileCount
        - scannedFileCount
        - proposalCount
        - issueCount
      properties:
        schemaVersion: { type: integer, const: 1 }
        eventType: { type: string, enum: [SNAPSHOT, PROGRESS, TERMINAL] }
        scanId: { type: string, format: uuid }
        emittedAt: { type: string, format: date-time }
        phase:
          type: string
          description: UNKNOWN is used when an authoritative snapshot cannot recover the volatile execution phase.
          enum: [UNKNOWN, DISCOVERY, RECONCILIATION, FINALIZING, TERMINAL]
        status: { $ref: '#/components/schemas/ScanRunStatus' }
        observedFileCount:
          type: integer
          format: int64
          description: Best-effort in-process progress; may reset to durable count after reconnect or restart.
        scannedFileCount:
          type: integer
          format: int64
          description: Durable count from scan_run.
        changedFileCount:
          type: [integer, 'null']
          format: int64
          description: Exact changed-file workload after staging diff; null before reconciliation begins.
        reconciledFileCount:
          type: [integer, 'null']
          format: int64
          description: Changed files whose business persistence checkpoint has committed.
        proposalCount: { type: integer, format: int64 }
        issueCount: { type: integer, format: int64 }
        finishedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
    ScanProposal:
      type: object
      required: [id, sourceRelativePath, profile, candidateType, identityKey]
      properties:
        id: { type: string, format: uuid }
        sourceRelativePath: { type: string }
        profile: { $ref: '#/components/schemas/ScanProfile' }
        candidateType: { type: string, enum: [VIDEO, ASSET, ALBUM] }
        identityKey: { type: string }
        displayTitle: { type: [string, 'null'] }
        assetRole: { type: [string, 'null'], enum: [PRIMARY_VIDEO, VIDEO, IMAGE, GIF, null] }
        evidence: { type: object, additionalProperties: true }
    ReviewQueueProposal:
      type: object
      required: [proposalId, scanId, rootKey, sourceRelativePath, profile, candidateType, identityKey, state]
      properties:
        proposalId: { type: string, format: uuid }
        scanId: { type: string, format: uuid }
        rootKey: { type: string }
        sourceRelativePath: { type: string }
        profile: { $ref: '#/components/schemas/ScanProfile' }
        candidateType: { type: string, enum: [VIDEO, ASSET, ALBUM] }
        identityKey: { type: string }
        displayTitle: { type: [string, 'null'] }
        assetRole: { type: [string, 'null'], enum: [PRIMARY_VIDEO, VIDEO, IMAGE, GIF, null] }
        evidence: { type: object, additionalProperties: true }
        state: { type: string, enum: [PENDING, REJECTED, APPROVED] }
        decidedAt: { type: [string, 'null'], format: date-time }
    ReviewQueueIssue:
      type: object
      required: [issueId, scanId, rootKey, sourceRelativePath, code, detail, detectedAt]
      properties:
        issueId: { type: string, format: uuid }
        scanId: { type: string, format: uuid }
        rootKey: { type: string }
        sourceRelativePath: { type: string }
        code: { type: string }
        detail: { type: string }
        detectedAt: { type: string, format: date-time }
    ScanIssue:
      type: object
      required: [id, sourceRelativePath, code, detail]
      properties:
        id: { type: string, format: uuid }
        sourceRelativePath: { type: string }
        code: { type: string, enum: [UNPARSEABLE, AMBIGUOUS, IO_ERROR] }
        detail: { type: string }
    ScanProposalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
    ScanProposalDecision:
      type: object
      required: [proposalId, decision, decidedAt]
      properties:
        proposalId: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVE, REJECT] }
        decidedAt: { type: string, format: date-time }
        eventId: { type: [string, 'null'], format: uuid }
    BatchDecisionResponse:
      type: object
      required: [decision, processedCount]
      properties:
        scanId: { type: [string, 'null'], format: uuid }
        decision: { type: string, enum: [APPROVE, REJECT] }
        processedCount: { type: integer }
    IssueRecheckAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
    BulkDecisionAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
    ScanAsyncJobStatus:
      type: object
      required: [jobId, jobType, status, createdAt]
      properties:
        jobId: { type: string, format: uuid }
        jobType: { type: string, enum: [BULK_DECISION, ISSUE_RECHECK] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        processedCount: { type: [integer, 'null'], format: int64 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        observationScanRunId: { type: [string, 'null'], format: uuid }
    ScanProposalPage:
      $ref: '#/components/schemas/PageScanProposal'
    ReviewQueueProposalPage:
      $ref: '#/components/schemas/PageReviewQueueProposal'
    ReviewQueueIssuePage:
      $ref: '#/components/schemas/PageReviewQueueIssue'
    ScanIssuePage:
      $ref: '#/components/schemas/PageScanIssue'
    PageScanProposal:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ScanProposal' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PageReviewQueueProposal:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ReviewQueueProposal' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PageReviewQueueIssue:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ReviewQueueIssue' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PageScanIssue:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ScanIssue' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ScanProfile:
      type: string
      enum: [JOKE_VIDEO, JOKE_ASSET, USE_VIDEO, USE_ASSET, USE_ALBUM]
    ScanRunStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
