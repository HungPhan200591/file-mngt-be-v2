openapi: 3.1.1
info:
  title: Catalog Service API
  version: v1
  description: Canonical API cho media subject và asset của Backend V2.
servers:
  - url: http://localhost:18101
    description: Local Catalog theo ADR-004
paths:
  /api/v2/catalog/subjects:
    post:
      operationId: createMediaSubject
      summary: Create a canonical media subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaSubjectRequest'
      responses:
        '201':
          description: Subject created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSubjectDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
    get:
      operationId: listMediaSubjects
      summary: List canonical media subjects
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/SubjectType'
        - $ref: '#/components/parameters/IdentityKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSubjectPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/v2/catalog/subjects/{subjectId}:
    get:
      operationId: getMediaSubject
      summary: Get a canonical media subject by id
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSubjectDetail'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
components:
  parameters:
    Region:
      name: region
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Region'
    SubjectType:
      name: subjectType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SubjectType'
    IdentityKey:
      name: identityKey
      in: query
      required: false
      description: Requires both region and subjectType.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    ValidationProblem:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictProblem:
      description: Canonical identity already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFoundProblem:
      description: Subject does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CreateMediaSubjectRequest:
      type: object
      required: [subjectType, region, identityKey]
      properties:
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        region:
          $ref: '#/components/schemas/Region'
        identityKey:
          type: string
          minLength: 1
          maxLength: 512
          description: Canonical key normalized by the caller.
        displayTitle:
          type: [string, 'null']
          maxLength: 512
        assets:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CreateMediaAssetRequest'
    CreateMediaAssetRequest:
      type: object
      required: [role, relativePath]
      properties:
        role:
          $ref: '#/components/schemas/MediaAssetRole'
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
    MediaSubjectDetail:
      type: object
      required: [id, subjectType, region, identityKey, createdAt, assets]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        region:
          $ref: '#/components/schemas/Region'
        identityKey:
          type: string
        displayTitle:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        assets:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    MediaAsset:
      type: object
      required: [id, role, relativePath]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MediaAssetRole'
        relativePath:
          type: string
    MediaSubjectPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MediaSubjectDetail'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    SubjectType:
      type: string
      enum: [VIDEO, ALBUM]
    Region:
      type: string
      enum: [JOKE, USE]
    MediaAssetRole:
      type: string
      enum: [PRIMARY_VIDEO, VIDEO, IMAGE, GIF]
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
