      <text x="115" y="30" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Ghi Dirty Page trong RAM</text>
    </g>
    <path d="M 290 265 L 360 265" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="360,265 352,260 352,270" fill="#ffffff"/>

    <g transform="translate(360, 240)">
