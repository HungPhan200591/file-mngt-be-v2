th=&quot;230&quot; height=&quot;50&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;u2&quot; value=&quot;⚡ BYPASS 100%&lt;br&gt;Ghi WAL &amp;amp; fsync() đĩa&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;box_unlog&quot;&gt;&lt;mxGeometry x=&quot;340&quot; y=&quot;50&quot; width=&quot;250&quot; height=&quot;50&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;u3&quot; value=&quot;Commit tức thì (Nhanh 3 - 5x)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=50;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;box_unlog&quot;&gt;&lt;mxGeometry x=&quot;660&quot; y=&quot;50&quot; width=&quot;200&quot; height=&quot;50&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;eu1&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=2;&quot; edge=&quot;1&quot; source=&quot;u1&quot; target=&quot;u2&quot; parent=&quot;box_unlog&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;eu2&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=2;&quot; edge=&quot;1&quot; source=&quot;u2&quot; target=&quot;u3&quot; parent=&quot;box_unlog&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="940" height="360" fill="#14171d"/>

    <!-- LOGGED BOX (y=20..160) -->
    <rect x="20" y="20" width="900" height="140" rx="8" ry="8" fill="#1e222b" stroke="#78909C" stroke-width="2"/>
    <rect x="20" y="20" width="900" height="28" rx="8" ry="8" fill="#37474F"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. BẢNG THƯỜNG (Logged Table — Có ghi WAL &amp; fsync)</text>

    <!-- Nodes Logged -->
    <g transform="translate(60, 70)">
      <rect x="0" y="0" width="230" height="50" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="115" y="30" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Ghi Dirty Page trong RAM</text>
    </g>
    <path d="M 290 95 L 360 95" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="360,95 352,90 352,100" fill="#ffffff"/>

    <g transform="translate(360, 70)">
      <rect x="0" y="0" width="250" height="50" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="125" y="30" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Ghi WAL + fsync() xuống đĩa</text>
    </g>
    <path d="M 610 95 L 680 95" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="680,95 672,90 672,100" fill="#ffffff"/>

    <g transform="translate(680, 70)">
      <rect x="0" y="0" width="200" height="50" rx="25" ry="25" fill="#4CAF50" stroke="#ffffff" stroke-width="1.5"/>
      <text x="100" y="30" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Xác nhận Commit (ACK)</text>
    </g>

    <!-- UNLOGGED BOX (y=190..330) -->
    <rect x="20" y="190" width="900" height="140" rx="8" ry="8" fill="#1e222b" stroke="#FF9800" stroke-width="2"/>
    <rect x="20" y="190" width="900" height="28" rx="8" ry="8" fill="#E65100"/>
    <text x="35" y="209" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. BẢNG UNLOGGED STAGING (V2 — Nhanh gấp 3 - 5 lần)</text>

