      <text x="125" y="22" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">⚡ BYPASS 100%</text>
      <text x="125" y="38" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">Ghi WAL &amp; fsync() đĩa</text>
