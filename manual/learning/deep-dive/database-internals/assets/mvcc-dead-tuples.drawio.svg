>
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="940" height="380" fill="#14171d"/>

    <!-- P1 (x=20..280) -->
    <rect x="20" y="20" width="260" height="330" rx="8" ry="8" fill="#1e222b" stroke="#2196F3" stroke-width="2"/>
