<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="940px" height="460px" viewBox="-0.5 -0.5 940 460" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-08-18T12:15:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;24.0.0&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;bp_dirty&quot; name=&quot;Buffer Pool and Dirty Pages&quot;&gt;&lt;mxGraphModel dx=&quot;940&quot; dy=&quot;460&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;940&quot; pageHeight=&quot;460&quot; background=&quot;#14171d&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;tier_ram&quot; value=&quot;1. TẦNG BỘ NHỚ RAM (Buffer Pool &amp;amp; Fast Mutate)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#009688;strokeWidth=2;fontColor=#80CBC4;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;480&quot; height=&quot;410&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;req&quot; value=&quot;Lệnh UPDATE / INSERT&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;tier_ram&quot;&gt;&lt;mxGeometry x=&quot;135&quot; y=&quot;45&quot; width=&quot;210&quot; height=&quot;40&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;check_hit&quot; value=&quot;Page 8KB đã có trong RAM?&quot; style=&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;fontSize=11;&quot; vertex=&quot;1&quot; parent=&