eColor=#4CAF50;strokeWidth=1.5;fontColor=#81C784;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;check_hit&quot; target=&quot;mutate&quot; parent=&quot;tier_ram&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;&gt;&lt;Array as=&quot;points&quot;&gt;&lt;mxPoint x=&quot;320&quot; y=&quot;240&quot;/&gt;&lt;mxPoint x=&quot;240&quot; y=&quot;240&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_load_mutate&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=1.5;&quot; edge=&quot;1&quot; source=&quot;load_disk&quot; target=&quot;mutate&quot; parent=&quot;tier_ram&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;tier_disk&quot; value=&quot;2. TẦNG LƯU TRỮ ĐĨA (Checkpointer Flush)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#9C27B0;strokeWidth=2;fontColor=#CE93D8;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;540&quot; y=&quot;20&quot; width=&quot;380&quot; height=&quot;410&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;checkpointer&quot; value=&quot;Checkpointer Thread&lt;br&gt;&lt;font color=&quot;#FFE082&quot; style=&quot;font-size: 10px;&quot;&gt;(Tiến trình ngầm gom hàng ngàn trang)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;tier_disk&quot;&gt;&lt;mxGeometry x=&quot;55&quot; y=&quot;115&quot; width=&quot;270&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;data_db&quot; value=&quot;Data Files (.db)&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 10px;&quot;&gt;🐢 Random I/O Flush hàng ngàn trang 8KB&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;tier_disk&quot;&gt;&lt;mxGeometry x=&quot;65&quot; y=&quot;270&quot; width=&quot;250&quot; height=&quot;85&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_chk_db&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=2;&quot; edge=&quot;1&quot; source=&quot;checkpointer&quot; target=&quot;data_db&quot; parent=&quot;tier_disk&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_mutate_chk&quot; value=&quot;Bypass Random I/O&lt;br&gt;(Không ghi đĩa ngay)&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#E91E63;strokeWidth=2;dashed=1;exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#F48FB1;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;mutate&quot; target=&quot;checkpointer&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;&gt;&lt;Array as=&quot;points&quot;&gt;&lt;mxPoint x=&quot;450&quot; y=&quot;338&quot;/&gt;&lt;mxPoint x=&quot;450&quot; y=&quot;163&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="940" height="460" fill="#14171d"/>

    <!-- TIER RAM (x=20..500) -->
    <rect x="20" y="20" width="480" height="410" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="20" y="20" width="480" height="28" rx="8" ry="8" fill="#004D40"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. TẦNG BỘ NHỚ RAM (Buffer Pool &amp; Fast Mutate)</text>

    <!-- Request -->
    <g transform="translate(155, 65)">
      <rect x="0" y="0" width="210" height="40" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="105" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Lệnh UPDATE / INSERT</text>
    </g>
    <!-- Arrow down -->
    <path d="M 260 105 L 260 130" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="260,130 256,122 264,122" fill="#ffffff"/>

    <!-- Check hit (Rhombus) -->
    <g transform="translate(135, 130)">
      <polygon points="125,0 250,32 125,65 0,32" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="125" y="36" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Page 8KB đã có trong RAM?</text>
    </g>

    <!-- Miss arrow -> Load Disk -->
    <path d="M 135 162 L 110 162 L 110 230" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <polygon points="110,230 106,222 114,222" fill="#E91E63"/>
    <text x="95" y="195" fill="#F48FB1" font-family="sans-serif" font-size="10px" font-weight="bold">Miss</text>

    <g transform="translate(40, 230)">
      <rect x="0" y="0" width="180" height="45" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Nạp Page 8KB từ Đĩa</text>
      <text x="90" y="36" fill="#FFCDD2" font-family="sans-serif" font-size="9px" text-anchor="middle">(Vào Buffer Pool)</text>
    </g>

    <!-- Hit arrow -> Mutate -->
    <path d="M 385 162 L 405 162 L 405 310 L 380 310" fill="none" stroke="#4CAF50" stroke-width="1.5"/>
    <polygon points="380,310 388,306 388,314" fill="#4CAF50"/>
    <text x="415" y="235" fill="#81C784" font-family="sans-serif" font-size="10px" font-weight="bold">Hit</text>

    <!-- Load to Mutate -->
    <path d="M 130 275 L 130 310 L 140 310" fill="none" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Mutate Box -->
    <g transform="translate(140, 310)">
      <rect x="0" y="0" width="240" height="55" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="2"/>
      <text x="120" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Sửa Byte trực tiếp trên RAM</text>
      <text x="120" y="42" fill="#FFCDD2" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">➔ Đánh dấu DIRTY PAGE</text>
    </g>

    <!-- TIER DISK (x=540..920) -->
    <rect x="540" y="20" width="380" height="410" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="540" y="20" width="380" height="28" rx="8" ry="8" fill="#4A148C"/>
    <text x="555" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. TẦNG LƯU TRỮ ĐĨA (Checkpointer Flush)</text>

    <!-- Checkpointer Thread -->
    <g transform="translate(595, 135)">
      <rect x="0" y="0" width="270" height="55" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="135" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Checkpointer Thread</text>
      <text x="135" y="42" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">(Tiến trình ngầm gom hàng ngàn trang)</text>
    </g>

    <!-- Arrow down to DB -->
    <path d="M 730 190 L 730 290" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="730,290 726,282 734,282" fill="#ffffff"/>

    <!-- Cylinder Data Files -->
    <g transform="translate(605, 290)">
      <path d="M 0 12 C 0 4, 250 4, 250 12 L 250 75 C 250 83, 0 83, 0 75 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="125" cy="12" rx="125" ry="10" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="125" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Data Files (.db)</text>
      <text x="125" y="58" fill="#F3E5F5" font-family="sans-serif" font-size="10px" text-anchor="middle">🐢 Random I/O Flush hàng ngàn trang 8KB</text>
    </g>

    <!-- Connection: Mutate -> Checkpointer -->
    <path d="M 380 338 L 470 338 L 470 162 L 595 162" fill="none" stroke="#E91E63" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="595,162 587,158 587,166" fill="#E91E63"/>
    <rect x="420" y="235" width="135" height="30" rx="4" fill="#1e222b" stroke="#E91E63" stroke-width="1"/>
    <text x="487" y="248" fill="#F48FB1" font-family="sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Bypass Random I/O</text>
    <text x="487" y="260" fill="#FFCDD2" font-family="sans-serif" font-size="8px" text-anchor="middle">(Không ghi đĩa ngay)</text>

  </g>
</svg>
