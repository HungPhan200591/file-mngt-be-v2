&quot; source=&quot;wal_disk&quot; target=&quot;ack_ok&quot; parent=&quot;lane_hot&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane_slow&quot; value=&quot;🐢 ĐƯỜNG XẢ DATA PAGE CHẬM (Background Flush vài phút sau)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#9C27B0;strokeWidth=2;fontColor=#CE93D8;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;210&quot; width=&quot;900&quot; height=&quot;170&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;dirty_page&quot; value=&quot;Dirty Pages 8KB&lt;br&gt;&lt;font color=&quot;#FFCDD2&quot; style=&quot;font-size: 11px;&quot;&gt;nằm tạm trên RAM (Buffer Pool)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E91E63;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_slow&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;65&quot; width=&quot;230&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;chk_thread&quot; value=&quot;Checkpointer Thread&lt;br&gt;&lt;font color=&quot;#FFE082&quot; style=&quot;font-size: 11px;&quot;&gt;Gom ngầm hàng ngàn trang 8KB&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_slow&quot;&gt;&lt;mxGeometry x=&quot;320&quot; y=&quot;65&quot; width=&quot;240&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;flush_disk&quot; value=&quot;Data Files (.db)&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 11px;&quot;&gt;Ghi Random I/O xuống đĩa&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_slow&quot;&gt;&lt;mxGeometry x=&quot;630&quot; y=&quot;50&quot; width=&quot;245&quot; height=&quot;85&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_s1&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=2;&quot; edge=&quot;1&quot; source=&quot;dirty_page&quot; target=&quot;chk_thread&quot; parent=&quot;lane_slow&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_s2&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=2;&quot; edge=&quot;1&quot; source=&quot;chk_thread&quot; target=&quot;flush_disk&quot; parent=&quot;lane_slow&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_tx_dirty&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#E91E63;strokeWidth=2;dashed=1;exitX=0.5;exitY=1;exitDx=0;exitDy=0;entryX=0.5;entryY=0;entryDx=0;entryDy=0;&quot; edge=&quot;1&quot; source=&quot;app_commit&quot; target=&quot;dirty_page&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="940" height="420" fill="#14171d"/>

    <!-- HOT PATH LANE (y=20..170) -->
    <rect x="20" y="20" width="900" height="150" rx="8" ry="8" fill="#1e222b" stroke="#4CAF50" stroke-width="2"/>
    <rect x="20" y="20" width="900" height="28" rx="8" ry="8" fill="#2E7D32"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">🚀 ĐƯỜNG GHI COMMIT NHANH (Hot Path &lt; 0.5ms)</text>

    <!-- Hot path nodes -->
    <g transform="translate(45, 75)">
      <rect x="0" y="0" width="160" height="55" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">1. App COMMIT</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 205 102 L 250 102" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="250,102 242,97 242,107" fill="#ffffff"/>

    <g transform="translate(250, 75)">
      <rect x="0" y="0" width="190" height="55" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="95" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">2. Ghi byte nhỏ</text>
      <text x="95" y="42" fill="#E0F2F1" font-family="sans-serif" font-size="10px" text-anchor="middle">vào WAL Buffer (RAM)</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 440 102 L 485 102" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="485,102 477,97 477,107" fill="#ffffff"/>

    <g transform="translate(485, 75)">
      <rect x="0" y="0" width="210" height="55" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="1.5"/>
      <text x="105" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">3. Ghi nối đuôi (Sequential)</text>
      <text x="105" y="42" fill="#E8F5E9" font-family="sans-serif" font-size="10px" text-anchor="middle">vào file .wal + fsync()</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 695 102 L 735 102" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="735,102 727,97 727,107" fill="#ffffff"/>

    <g transform="translate(735, 75)">
      <rect x="0" y="0" width="160" height="55" rx="27" ry="27" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
      <text x="80" y="24" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">4. Trả ACK OK</text>
      <text x="80" y="42" fill="#E8F5E9" font-family="sans-serif" font-size="10px" text-anchor="middle">(Client nhận kết quả)</text>
    </g>

    <!-- SLOW PATH LANE (y=210..380) -->
    <rect x="20" y="210" width="900" height="170" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="20" y="210" width="900" height="28" rx="8" ry="8" fill="#4A148C"/>
    <text x="35" y="229" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">🐢 ĐƯỜNG XẢ DATA PAGE CHẬM (Background Flush vài phút sau)</text>

    <!-- Slow path nodes -->
    <g transform="translate(45, 275)">
      <rect x="0" y="0" width="230" height="65" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="115" y="26" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Dirty Pages 8KB</text>
      <text x="115" y="46" fill="#FFCDD2" font-family="sans-serif" font-size="10px" text-anchor="middle">nằm tạm trên RAM (Buffer Pool)</text>
    </g>

    <!-- Arrow S1 -->
    <path d="M 275 307 L 340 307" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="340,307 332,302 332,312" fill="#ffffff"/>

    <g transform="translate(340, 275)">
      <rect x="0" y="0" width="240" height="65" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="26" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Checkpointer Thread</text>
      <text x="120" y="46" fill="#FFE082" font-family="sans-serif" font-size="10px" text-anchor="middle">Gom ngầm hàng ngàn trang 8KB</text>
    </g>

    <!-- Arrow S2 -->
    <path d="M 580 307 L 650 307" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="650,307 642,302 642,312" fill="#ffffff"/>

    <!-- Cylinder -->
    <g transform="translate(650, 260)">
      <path d="M 0 12 C 0 4, 245 4, 245 12 L 245 75 C 245 83, 0 83, 0 75 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="122" cy="12" rx="122" ry="10" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="122" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Data Files (.db)</text>
      <text x="122" y="58" fill="#F3E5F5" font-family="sans-serif" font-size="10px" text-anchor="middle">Ghi Random I/O xuống đĩa</text>
    </g>

    <!-- Dashed connection Commit -> Dirty Page -->
    <path d="M 125 130 L 125 275" fill="none" stroke="#E91E63" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="125,275 121,267 129,267" fill="#E91E63"/>

  </g>
