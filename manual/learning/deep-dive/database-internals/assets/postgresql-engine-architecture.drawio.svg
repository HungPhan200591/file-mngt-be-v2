<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="960px" height="520px" viewBox="-0.5 -0.5 960 520" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-08-18T13:20:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;24.0.0&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;pg_arch&quot; name=&quot;PostgreSQL Architecture 3 Tiers&quot;&gt;&lt;mxGraphModel dx=&quot;960&quot; dy=&quot;520&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;960&quot; pageHeight=&quot;520&quot; background=&quot;#14171d&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;lane_q&quot; value=&quot;1. TẦNG XỬ LÝ TRUY VẤN (Query Processing Layer)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#2196F3;strokeWidth=2;fontColor=#64B5F6;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;470&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_sql&quot; value=&quot;Client SQL Query&lt;br&gt;&lt;font color=&quot;#E3F2FD&quot; style=&quot;font-size: 10px;&quot;&gt;(SELECT / INSERT / COPY)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;50&quot; width=&quot;240&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_parse&quot; value=&quot;Parser &amp;amp; Rewriter&lt;br&gt;&lt;font color=&quot;#FFF3E0&quot; style=&quot;font-size: 10px;&quot;&gt;(Cây cú pháp AST)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;145&quot; width=&quot;240&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_plan&quot; value=&quot;Query Optimizer&lt;br&gt;&lt;font color=&quot;#FFF3E0&quot; style=&quot;font-size: 10px;&quot;&gt;(Execution Plan)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;240&quot; width=&quot;240&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_exec&quot; value=&quot;Query Executor&lt;br&gt;&lt;font color=&quot;#FFF3E0&quot; style=&quot;font-size: 10px;&quot;&gt;(Join / Scan Engine)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;345&quot; width=&quot;240&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane_m&quot; value=&quot;2. TẦNG BỘ NHỚ RAM (Shared Buffers &amp;amp; work_mem)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#009688;strokeWidth=2;fontColor=#80CBC4;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;330&quot; y=&quot;20&quot; width=&quot;310&quot; height=&quot;470&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;m_work&quot; value=&quot;work_mem (Process Local)&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;Hash / Sort trong RAM&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_m&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;60&quot; width=&quot;270&quot; height=&quot;60&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;m_buf&quot; value=&quot;Buffer Pool (Shared Buffers)&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;Data Pages 8KB (Dirty Pages)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_m&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;180&quot; width=&quot;270&quot; height=&quot;75&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;m_wal&quot; value=&quot;WAL Buffers&lt;br&gt;&lt;font color=&quot;#FFCDD2&quot; style=&quot;font-size: 10px;&quot;&gt;Hàng đợi nhật ký ghi (RAM)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E91E63;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_m&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;330&quot; width=&quot;270&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane_d&quot; value=&quot;3. TẦNG LƯU TRỮ ĐĨA (Storage Engine)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#9C27B0;strokeWidth=2;fontColor=#CE93D8;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;670&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;470&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;d_data&quot; value=&quot;Data Files (.db)&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 10px;&quot;&gt;Random I/O Blocks&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_d&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;170&quot; width=&quot;220&quot; height=&quot;90&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;d_wal&quot; value=&quot;WAL Files (.wal)&lt;br&gt;&lt;font color=&quot;#E8F5E9&quot; style=&quot;font-size: 10px;&quot;&gt;Sequential Append fsync()&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_d&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;320&quot; width=&quot;220&quot; height=&quot;85&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;eq1&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=1.5;&quot; edge=&quot;1&quot; source=&quot;q_sql&quot; target=&quot;q_parse&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;eq2&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=1.5;&quot; edge=&quot;1&quot; source=&quot;q_parse&quot; target=&quot;q_plan&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;eq3&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#ffffff;strokeWidth=1.5;&quot; edge=&quot;1&quot; source=&quot;q_plan&quot; target=&quot;q_exec&quot; parent=&quot;lane_q&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_exec_work&quot; value=&quot;Hash Join&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#009688;strokeWidth=1.5;dashed=1;exitX=1;exitY=0.2;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#80CBC4;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;q_exec&quot; target=&quot;m_work&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_exec_buf&quot; value=&quot;1. Nạp / Sửa RAM&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#009688;strokeWidth=2;exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#80CBC4;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;q_exec&quot; target=&quot;m_buf&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_exec_wal&quot; value=&quot;2. Log Commit&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#E91E63;strokeWidth=2;exitX=1;exitY=0.8;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#F48FB1;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;q_exec&quot; target=&quot;m_wal&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_buf_disk&quot; value=&quot;🐢 Checkpoint Flush&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#9C27B0;strokeWidth=1.5;dashed=1;exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#CE93D8;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;m_buf&quot; target=&quot;d_data&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;e_wal_disk&quot; value=&quot;🚀 Fast fsync()&quot; style=&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4CAF50;strokeWidth=2.5;exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;fontColor=#81C784;fontStyle=1;&quot; edge=&quot;1&quot; source=&quot;m_wal&quot; target=&quot;d_wal&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="960" height="520" fill="#14171d"/>

    <!-- LANE 1: QUERY LAYER (x=20..300) -->
    <rect x="20" y="20" width="280" height="470" rx="8" ry="8" fill="#1e222b" stroke="#2196F3" stroke-width="2"/>
    <rect x="20" y="20" width="280" height="28" rx="8" ry="8" fill="#1565C0"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">1. TẦNG XỬ LÝ TRUY VẤN (Query Layer)</text>

    <!-- Node SQL -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="240" height="50" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Client SQL Query</text>
      <text x="120" y="38" fill="#E3F2FD" font-family="sans-serif" font-size="9px" text-anchor="middle">(SELECT / INSERT / COPY)</text>
    </g>
    <path d="M 160 115 L 160 145" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="160,145 156,137 164,137" fill="#ffffff"/>

    <!-- Node Parser -->
    <g transform="translate(40, 145)">
      <rect x="0" y="0" width="240" height="50" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Parser &amp; Rewriter</text>
      <text x="120" y="38" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">(Cây cú pháp AST)</text>
    </g>
    <path d="M 160 195 L 160 225" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="160,225 156,217 164,217" fill="#ffffff"/>

    <!-- Node Planner -->
    <g transform="translate(40, 225)">
      <rect x="0" y="0" width="240" height="50" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Query Optimizer</text>
      <text x="120" y="38" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">(Execution Plan)</text>
    </g>
    <path d="M 160 275 L 160 305" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="160,305 156,297 164,297" fill="#ffffff"/>

    <!-- Node Executor -->
    <g transform="translate(40, 305)">
      <rect x="0" y="0" width="240" height="65" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="2"/>
      <text x="120" y="28" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Query Executor</text>
      <text x="120" y="46" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">(Join / Scan Engine)</text>
    </g>

    <!-- LANE 2: RAM MEMORY LAYER (x=330..640) -->
    <rect x="330" y="20" width="310" height="470" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="330" y="20" width="310" height="28" rx="8" ry="8" fill="#004D40"/>
    <text x="345" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">2. TẦNG BỘ NHỚ RAM (Shared Buffers)</text>

    <!-- Node work_mem -->
    <g transform="translate(350, 75)">
      <rect x="0" y="0" width="270" height="60" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="135" y="26" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">work_mem (Process Local)</text>
      <text x="135" y="44" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Hash / Sort trong RAM</text>
    </g>

    <!-- Node Buffer Pool -->
    <g transform="translate(350, 195)">
      <rect x="0" y="0" width="270" height="75" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="2"/>
      <text x="135" y="32" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Buffer Pool (Shared Buffers)</text>
      <text x="135" y="52" fill="#E0F2F1" font-family="sans-serif" font-size="10px" text-anchor="middle">Data Pages 8KB (Dirty Pages)</text>
    </g>

    <!-- Node WAL Buffers -->
    <g transform="translate(350, 335)">
      <rect x="0" y="0" width="270" height="65" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="135" y="28" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">WAL Buffers</text>
      <text x="135" y="46" fill="#FFCDD2" font-family="sans-serif" font-size="10px" text-anchor="middle">Hàng đợi nhật ký ghi (RAM)</text>
    </g>

    <!-- LANE 3: STORAGE DISK LAYER (x=670..940) -->
    <rect x="670" y="20" width="270" height="470" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="670" y="20" width="270" height="28" rx="8" ry="8" fill="#4A148C"/>
    <text x="685" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">3. TẦNG LƯU TRỮ ĐĨA (Storage Engine)</text>

    <!-- Node Data Files -->
    <g transform="translate(695, 185)">
      <path d="M 0 12 C 0 4, 220 4, 220 12 L 220 80 C 220 88, 0 88, 0 80 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="110" cy="12" rx="110" ry="10" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="110" y="42" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Data Files (.db)</text>
      <text x="110" y="60" fill="#F3E5F5" font-family="sans-serif" font-size="10px" text-anchor="middle">Random I/O Blocks</text>
    </g>

    <!-- Node WAL Files -->
    <g transform="translate(695, 330)">
      <path d="M 0 12 C 0 4, 220 4, 220 12 L 220 75 C 220 83, 0 83, 0 75 Z" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="110" cy="12" rx="110" ry="10" fill="#81C784" stroke="#ffffff" stroke-width="1.5"/>
      <text x="110" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">WAL Files (.wal)</text>
      <text x="110" y="58" fill="#E8F5E9" font-family="sans-serif" font-size="10px" text-anchor="middle">Sequential Append fsync()</text>
    </g>

    <!-- Inter-layer connections -->
    <!-- Executor -> work_mem -->
    <path d="M 280 320 L 315 320 L 315 105 L 350 105" fill="none" stroke="#009688" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="350,105 342,101 342,109" fill="#009688"/>
    <text x="315" y="210" fill="#80CBC4" font-family="sans-serif" font-size="9px" font-weight="bold" text-anchor="middle" transform="rotate(-90, 315, 210)">Hash Join</text>

    <!-- Executor -> Buffer Pool -->
    <path d="M 280 338 L 350 232" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="350,232 342,230 346,238" fill="#009688"/>

    <!-- Executor -> WAL Buffers -->
    <path d="M 280 355 L 350 368" fill="none" stroke="#E91E63" stroke-width="2"/>
    <polygon points="350,368 342,364 344,372" fill="#E91E63"/>

    <!-- Buffer Pool -> Data Files -->
    <path d="M 620 232 L 695 232" fill="none" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="695,232 687,228 687,236" fill="#9C27B0"/>
    <rect x="625" y="215" width="65" height="16" rx="3" fill="#1e222b" stroke="#9C27B0" stroke-width="1"/>
    <text x="657" y="226" fill="#CE93D8" font-family="sans-serif" font-size="8px" font-weight="bold" text-anchor="middle">Checkpoint</text>

    <!-- WAL Buffers -> WAL Files -->
    <path d="M 620 368 L 695 368" fill="none" stroke="#4CAF50" stroke-width="2.5"/>
    <polygon points="695,368 687,364 687,372" fill="#4CAF50"/>
    <rect x="625" y="350" width="65" height="16" rx="3" fill="#1e222b" stroke="#4CAF50" stroke-width="1"/>
    <text x="657" y="361" fill="#81C784" font-family="sans-serif" font-size="8px" font-weight="bold" text-anchor="middle">🚀 fsync()</text>

  </g>
</svg>
