<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000px" height="540px" viewBox="-0.5 -0.5 1000 540" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-08-18T15:20:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;24.0.0&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;stock_rollback_flow&quot; name=&quot;Order Timeout and Stock Rollback Flow&quot;&gt;&lt;mxGraphModel dx=&quot;1000&quot; dy=&quot;540&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;1000&quot; pageHeight=&quot;540&quot; background=&quot;#14171d&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;d_col1&quot; value=&quot;1. ORDER SERVICE (Tạo Đơn)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#2196F3;strokeWidth=2;fontColor=#64B5F6;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;o_create&quot; value=&quot;Tạo Đơn Hàng Mới&lt;br&gt;&lt;font color=&quot;#BBDEFB&quot; style=&quot;font-size: 10px;&quot;&gt;status: UNPAID&lt;br&gt;created_at: 10:00&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;60&quot; width=&quot;180&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;o_cancel&quot; value=&quot;Cập nhật Trạng Thái:&lt;br&gt;&lt;font color=&quot;#FFCDD2&quot; style=&quot;font-size: 10px;&quot;&gt;status = CANCELLED_TIMEOUT&lt;br&gt;ở phút 10:15&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#880E4F;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;370&quot; width=&quot;180&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;d_col2&quot; value=&quot;2. DELAYED MESSAGE QUEUE&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#FF9800;strokeWidth=2;fontColor=#FFB74D;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;260&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_delay_node&quot; value=&quot;⏳ Delayed Exchange (15m)&lt;br&gt;&lt;font color=&quot;#FFE082&quot; style=&quot;font-size: 10px;&quot;&gt;RabbitMQ DLX / Redis ZSET&lt;br&gt;Giữ tin nhắn 15 phút&lt;/font&gt;&quot; style=&quot;shape=hexagon;perimeter=hexagonPerimeter2;whiteSpace=wrap;html=1;size=0.15;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col2&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;q_trigger&quot; value=&quot;🔔 Kích Hoạt Timeout Event&lt;br&gt;&lt;font color=&quot;#FFE082&quot; style=&quot;font-size: 10px;&quot;&gt;order.check.timeout (10:15)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col2&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;220&quot; width=&quot;200&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;d_col3&quot; value=&quot;3. TIMEOUT RECONCILIATION&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#009688;strokeWidth=2;fontColor=#80CBC4;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;520&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_check&quot; value=&quot;Kiểm Tra Trạng Thái Đơn&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;Nếu PAID: Bỏ qua (No-Op)&lt;br&gt;Nếu UNPAID: Kích hoạt Hủy&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col3&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;220&quot; width=&quot;180&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_comp&quot; value=&quot;Kích Hoạt Hoàn Kho&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;Compensation Saga&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col3&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;370&quot; width=&quot;180&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;d_col4&quot; value=&quot;4. INVENTORY ROLLBACK&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#4CAF50;strokeWidth=2;fontColor=#81C784;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;760&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;inv_redis&quot; value=&quot;Redis Lua Hoàn Kho:&lt;br&gt;&lt;font color=&quot;#E8F5E9&quot; style=&quot;font-size: 10px;&quot;&gt;INCR available_stock (+1)&lt;br&gt;DECR reserved_stock (-1)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col4&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;220&quot; width=&quot;180&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;inv_db&quot; value=&quot;PostgreSQL Sync:&lt;br&gt;&lt;font color=&quot;#E8F5E9&quot; style=&quot;font-size: 10px;&quot;&gt;available = available + 1&lt;br&gt;reserved = reserved - 1&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;d_col4&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;365&quot; width=&quot;180&quot; height=&quot;80&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="1000" height="540" fill="#14171d"/>

    <!-- COL 1: Order Service -->
    <rect x="20" y="20" width="220" height="490" rx="8" ry="8" fill="#1e222b" stroke="#2196F3" stroke-width="2"/>
    <rect x="20" y="20" width="220" height="28" rx="8" ry="8" fill="#1565C0"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">1. ORDER SERVICE</text>

    <!-- Node Tạo Đơn -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="180" height="70" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Tạo Đơn Hàng Mới</text>
      <text x="90" y="42" fill="#E3F2FD" font-family="sans-serif" font-size="9px" text-anchor="middle">status: UNPAID</text>
      <text x="90" y="56" fill="#E3F2FD" font-family="sans-serif" font-size="9px" text-anchor="middle">Hạn thanh toán: 15 phút</text>
    </g>

    <!-- Node Cancel Order -->
    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="180" height="70" rx="6" ry="6" fill="#880E4F" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Cập nhật Trạng Thái Đơn</text>
      <text x="90" y="42" fill="#FFCDD2" font-family="sans-serif" font-size="9px" text-anchor="middle">status = CANCELLED_TIMEOUT</text>
      <text x="90" y="56" fill="#FFCDD2" font-family="sans-serif" font-size="9px" text-anchor="middle">ở phút thứ 15:00</text>
    </g>

    <!-- COL 2: Delayed Queue -->
    <rect x="260" y="20" width="240" height="490" rx="8" ry="8" fill="#1e222b" stroke="#FF9800" stroke-width="2"/>
    <rect x="260" y="20" width="240" height="28" rx="8" ry="8" fill="#E65100"/>
    <text x="275" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">2. DELAYED MESSAGE QUEUE</text>

    <!-- Node Delayed Queue -->
    <g transform="translate(280, 65)">
      <polygon points="20,0 180,0 200,40 180,80 20,80 0,40" fill="#FF9800" stroke="#ffffff" stroke-width="2"/>
      <text x="100" y="32" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">⏳ Delayed Exchange (15m)</text>
      <text x="100" y="48" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">RabbitMQ DLX / Redis ZSET</text>
      <text x="100" y="62" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">Hẹn giờ kích hoạt sau 15m</text>
    </g>

    <!-- Trigger Node -->
    <g transform="translate(280, 230)">
      <rect x="0" y="0" width="200" height="65" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="100" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">🔔 Bắn Tin Nhắn Hết Hạn</text>
      <text x="100" y="42" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">order.check.timeout (10:15)</text>
      <text x="100" y="55" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">Tới Consumer đối soát</text>
    </g>

    <!-- COL 3: Reconciliation -->
    <rect x="520" y="20" width="220" height="490" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="520" y="20" width="220" height="28" rx="8" ry="8" fill="#004D40"/>
    <text x="535" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">3. TIMEOUT RECONCILIATION</text>

    <!-- Check Status -->
    <g transform="translate(540, 230)">
      <rect x="0" y="0" width="180" height="65" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Kiểm Tra Trạng Thái Đơn</text>
      <text x="90" y="38" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Nếu PAID: Bỏ qua (No-Op)</text>
      <text x="90" y="52" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Nếu UNPAID: Bắt đầu Hủy</text>
    </g>

    <!-- Trigger Comp -->
    <g transform="translate(540, 390)">
      <rect x="0" y="0" width="180" height="70" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Kích Hoạt Hoàn Kho</text>
      <text x="90" y="42" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Compensation Saga</text>
      <text x="90" y="56" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Nhả hàng về kho</text>
    </g>

    <!-- COL 4: Inventory Rollback -->
    <rect x="760" y="20" width="220" height="490" rx="8" ry="8" fill="#1e222b" stroke="#4CAF50" stroke-width="2"/>
    <rect x="760" y="20" width="220" height="28" rx="8" ry="8" fill="#1B5E20"/>
    <text x="775" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">4. INVENTORY ROLLBACK</text>

    <!-- Redis Lua Rollback -->
    <g transform="translate(780, 230)">
      <rect x="0" y="0" width="180" height="65" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
      <text x="90" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">⚡ Redis Lua Hoàn Kho</text>
      <text x="90" y="40" fill="#E8F5E9" font-family="sans-serif" font-size="9px" text-anchor="middle">INCR available_stock (+1)</text>
      <text x="90" y="54" fill="#E8F5E9" font-family="sans-serif" font-size="9px" text-anchor="middle">DECR reserved_stock (-1)</text>
    </g>

    <!-- DB Sync -->
    <g transform="translate(780, 385)">
      <path d="M 0 10 C 0 3, 180 3, 180 10 L 180 65 C 180 72, 0 72, 0 65 Z" fill="#4CAF50" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="90" cy="10" rx="90" ry="7" fill="#81C784" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">PostgreSQL Sync</text>
      <text x="90" y="48" fill="#E8F5E9" font-family="sans-serif" font-size="9px" text-anchor="middle">available = available + 1</text>
      <text x="90" y="62" fill="#E8F5E9" font-family="sans-serif" font-size="9px" text-anchor="middle">reserved = reserved - 1</text>
    </g>

    <!-- Connectors -->
    <path d="M 220 100 L 280 100" fill="none" stroke="#FF9800" stroke-width="2"/>
    <polygon points="280,100 272,96 272,104" fill="#FF9800"/>

    <path d="M 380 145 L 380 230" fill="none" stroke="#FF9800" stroke-width="2"/>
    <polygon points="380,230 376,222 384,222" fill="#FF9800"/>

    <path d="M 480 262 L 540 262" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="540,262 532,258 532,266" fill="#009688"/>

    <path d="M 630 295 L 630 390" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="630,390 626,382 634,382" fill="#009688"/>

    <path d="M 540 425 L 220 425" fill="none" stroke="#E91E63" stroke-width="2"/>
    <polygon points="220,425 228,421 228,429" fill="#E91E63"/>

    <path d="M 720 425 L 780 425" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="780,425 772,421 772,429" fill="#4CAF50"/>

    <path d="M 870 295 L 870 385" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="870,385 866,377 874,377" fill="#4CAF50"/>
  </g>
</svg>
