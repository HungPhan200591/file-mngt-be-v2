về FALSE&lt;br&gt;Báo: 'Ghế đang được giữ chỗ'&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#880E4F;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c2&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;190&quot; width=&quot;220&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;r_expire&quot; value=&quot;⌛ Hết hạn 10 phút:&lt;br&gt;&lt;font color=&quot;#FFE082&quot; style=&quot;font-size: 10px;&quot;&gt;Redis Key tự động xóa&lt;br&gt;Ghế tự động nhả cho người khác&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#455A64;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c2&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;380&quot; width=&quot;220&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c3&quot; value=&quot;3. PAYMENT GATEWAY&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#009688;strokeWidth=2;fontColor=#80CBC4;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;540&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;p_gw&quot; value=&quot;Cổng Thanh Toán&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;VNPay / Stripe / Visa&lt;/font&gt;&quot; style=&quot;shape=hexagon;perimeter=hexagonPerimeter2;whiteSpace=wrap;html=1;size=0.15;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c3&quot;&gt;&lt;mxGeometry x=&quot;15&quot; y=&quot;210&quot; width=&quot;170&quot; height=&quot;60&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;p_webhook&quot; value=&quot;Async IPN Webhook&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;Payment Success Event&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c3&quot;&gt;&lt;mxGeometry x=&quot;15&quot; y=&quot;380&quot; width=&quot;170&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c4&quot; value=&quot;4. AIRLINE CORE DATABASE&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#9C27B0;strokeWidth=2;fontColor=#CE93D8;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;760&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;db_seats&quot; value=&quot;flight_seats Table&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 10px;&quot;&gt;seat_id: 12A&lt;br&gt;status: BOOKED&lt;br&gt;passenger_id: user_123&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c4&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;370&quot; width=&quot;180&quot; height=&quot;85&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;db_booking&quot; value=&quot;bookings Table&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 10px;&quot;&gt;booking_ref: PNR-8899&lt;br&gt;status: CONFIRMED&lt;/font&gt;&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;c4&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;60&quot; width=&quot;180&quot; height=&quot;75&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="1000" height="540" fill="#14171d"/>

    <!-- COL 1: Passenger -->
    <rect x="20" y="20" width="220" height="490" rx="8" ry="8" fill="#1e222b" stroke="#2196F3" stroke-width="2"/>
    <rect x="20" y="20" width="220" height="28" rx="8" ry="8" fill="#1565C0"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">1. PASSENGER (Chọn Ghế)</text>

    <!-- Node Chọn Ghế -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="180" height="60" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Khách chọn Ghế 12A</text>
      <text x="90" y="42" fill="#E3F2FD" font-family="sans-serif" font-size="9px" text-anchor="middle">Chuyến bay VN-123</text>
    </g>

    <!-- Node Thanh toán -->
    <g transform="translate(40, 220)">
      <rect x="0" y="0" width="180" height="60" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Quẹt Thẻ / Quét QR</text>
      <text x="90" y="42" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">Hạn thanh toán: 10 phút</text>
    </g>

    <!-- Node E-ticket -->
    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="180" height="65" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">🎟️ Xuất Vé (E-Ticket)</text>
      <text x="90" y="42" fill="#E8F5E9" font-family="sans-serif" font-size="9px" text-anchor="middle">Seat: 12A CONFIRMED</text>
    </g>

    <!-- COL 2: Redis Lease -->
    <rect x="260" y="20" width="260" height="490" rx="8" ry="8" fill="#1e222b" stroke="#FF9800" stroke-width="2"/>
    <rect x="260" y="20" width="260" height="28" rx="8" ry="8" fill="#E65100"/>
    <text x="275" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">2. DISTRIBUTED LEASE (Redis)</text>

    <!-- Node Soft Lock -->
    <g transform="translate(280, 65)">
      <rect x="0" y="0" width="220" height="75" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="2"/>
      <text x="110" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">🔒 Seat Soft Lock (Lease)</text>
      <text x="110" y="40" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">SET seat:VN123:12A user_123</text>
      <text x="110" y="55" fill="#FFF3E0" font-family="sans-serif" font-size="9px" text-anchor="middle">NX EX 600 (10 phút)</text>
    </g>

    <!-- Node Conflict -->
    <g transform="translate(280, 220)">
      <rect x="0" y="0" width="220" height="60" rx="6" ry="6" fill="#880E4F" stroke="#ffffff" stroke-width="1.5"/>
      <text x="110" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">❌ Khách khác chọn 12A</text>
      <text x="110" y="42" fill="#FFCDD2" font-family="sans-serif" font-size="9px" text-anchor="middle">SET NX trả về FALSE (Ghế đang giữ)</text>
    </g>

    <!-- Node Expire -->
    <g transform="translate(280, 390)">
      <rect x="0" y="0" width="220" height="65" rx="6" ry="6" fill="#455A64" stroke="#ffffff" stroke-width="1.5"/>
      <text x="110" y="22" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">⌛ Hết hạn 10 phút (Timeout)</text>
      <text x="110" y="40" fill="#ECEFF1" font-family="sans-serif" font-size="9px" text-anchor="middle">Redis Key tự hủy</text>
      <text x="110" y="55" fill="#ECEFF1" font-family="sans-serif" font-size="9px" text-anchor="middle">Ghế mở lại cho hành khách khác</text>
    </g>

    <!-- COL 3: Payment Gateway -->
    <rect x="540" y="20" width="200" height="490" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="540" y="20" width="200" height="28" rx="8" ry="8" fill="#004D40"/>
    <text x="555" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">3. PAYMENT GATEWAY</text>

    <!-- Gateway Hexagon -->
    <g transform="translate(555, 220)">
      <polygon points="17,0 153,0 170,30 153,60 17,60 0,30" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="85" y="26" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Cổng Thanh Toán</text>
      <text x="85" y="42" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">VNPay / Stripe / Visa</text>
    </g>

    <!-- Webhook -->
    <g transform="translate(555, 390)">
      <rect x="0" y="0" width="170" height="65" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="85" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Async Webhook (IPN)</text>
      <text x="85" y="42" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">Báo thanh toán thành công</text>
    </g>

    <!-- COL 4: Core DB -->
    <rect x="760" y="20" width="220" height="490" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="760" y="20" width="220" height="28" rx="8" ry="8" fill="#4A148C"/>
    <text x="775" y="39" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold">4. CORE DATABASE (PostgreSQL)</text>

    <!-- Booking Table -->
    <g transform="translate(780, 65)">
      <path d="M 0 10 C 0 3, 180 3, 180 10 L 180 65 C 180 72, 0 72, 0 65 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="90" cy="10" rx="90" ry="7" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">bookings Table</text>
      <text x="90" y="48" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">pnr_code: PNR-8899</text>
      <text x="90" y="62" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">status: PENDING_PAYMENT</text>
    </g>

    <!-- Seats Table -->
    <g transform="translate(780, 375)">
      <path d="M 0 10 C 0 3, 180 3, 180 10 L 180 80 C 180 87, 0 87, 0 80 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="90" cy="10" rx="90" ry="7" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">flight_seats Table</text>
      <text x="90" y="50" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">seat_number: 12A</text>
      <text x="90" y="64" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">status: HARD_BOOKED</text>
      <text x="90" y="78" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">passenger_id: user_123</text>
    </g>

    <!-- Connectors -->
    <path d="M 220 95 L 280 95" fill="none" stroke="#2196F3" stroke-width="2"/>
    <polygon points="280,95 272,91 272,99" fill="#2196F3"/>

    <path d="M 130 125 L 130 220" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="130,220 126,212 134,212" fill="#ffffff"/>

    <path d="M 220 250 L 555 250" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="555,250 547,246 547,254" fill="#009688"/>

    <path d="M 640 280 L 640 390" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="640,390 636,382 644,382" fill="#009688"/>

    <path d="M 725 422 L 780 422" fill="none" stroke="#9C27B0" stroke-width="2"/>
    <polygon points="780,422 772,418 772,426" fill="#9C27B0"/>

    <path d="M 780 435 L 220 435" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="220,435 228,431 228,439" fill="#4CAF50"/>
  </g>
