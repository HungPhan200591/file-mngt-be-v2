<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="960px" height="540px" viewBox="-0.5 -0.5 960 540" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-08-18T13:15:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;24.0.0&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;subflow_d&quot; name=&quot;Review Projection Swap&quot;&gt;&lt;mxGraphModel dx=&quot;960&quot; dy=&quot;540&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;960&quot; pageHeight=&quot;540&quot; background=&quot;#14171d&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;lane_proj&quot; value=&quot;🔄 LUỒNG CON D: BACKGROUND REVIEW PROJECTION &amp;amp; GENERATION SWAP O(1)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;startSize=28;fillColor=#1e222b;strokeColor=#4CAF50;strokeWidth=2;fontColor=#81C784;fontStyle=1;fontSize=12;rounded=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;920&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c_done&quot; value=&quot;Scan hoàn tất 100%&lt;br&gt;&lt;font color=&quot;#E8F5E9&quot; style=&quot;font-size: 10px;&quot;&gt;(Status = COMPLETED)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;30&quot; y=&quot;50&quot; width=&quot;230&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_enq&quot; value=&quot;Đẩy 1 Task vào DB Table:&lt;br&gt;&lt;font color=&quot;#E3F2FD&quot; style=&quot;font-size: 10px;&quot;&gt;scan_review_proj_task&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;320&quot; y=&quot;50&quot; width=&quot;250&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_wrk&quot; value=&quot;Worker @Scheduled (1s)&lt;br&gt;&lt;font color=&quot;#FFF3E0&quot; style=&quot;font-size: 10px;&quot;&gt;Bốc Task xử lý ngầm độc lập&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;640&quot; y=&quot;50&quot; width=&quot;240&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_bld&quot; value=&quot;Dựng ngầm Thế Hệ 2 (Gen 2)&lt;br&gt;&lt;font color=&quot;#E0F2F1&quot; style=&quot;font-size: 10px;&quot;&gt;INSERT INTO review_proposal WHERE gen = 2&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;640&quot; y=&quot;150&quot; width=&quot;240&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_lck&quot; value=&quot;lockRoot(rootKey)&lt;br&gt;&lt;font color=&quot;#FFCDD2&quot; style=&quot;font-size: 10px;&quot;&gt;SELECT ... FOR UPDATE (Khóa độc quyền)&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E91E63;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;320&quot; y=&quot;150&quot; width=&quot;250&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_ref&quot; value=&quot;Cập nhật quyết định cũ&lt;br&gt;&lt;font color=&quot;#F3E5F5&quot; style=&quot;font-size: 10px;&quot;&gt;Giữ nguyên các file đã duyệt từ trước&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#9C27B0;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;30&quot; y=&quot;150&quot; width=&quot;230&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_swp&quot; value=&quot;⚡ TRÁO THẾ HỆ O(1) TỨC THÌ (&amp;lt; 1ms)&lt;br&gt;&lt;font color=&quot;#E8F5E9&quot; style=&quot;font-size: 11px;&quot;&gt;UPDATE projection_root SET current_gen = 2 WHERE root_key = :key&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=20;fillColor=#4CAF50;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;130&quot; y=&quot;270&quot; width=&quot;660&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_cln&quot; value=&quot;Dọn rác thế hệ cũ (Chạy ngầm)&lt;br&gt;&lt;font color=&quot;#ECEFF1&quot; style=&quot;font-size: 10px;&quot;&gt;DELETE FROM review_proposal WHERE gen &amp;lt; 2&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#455A64;strokeColor=#ffffff;strokeWidth=1.5;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;130&quot; y=&quot;390&quot; width=&quot;310&quot; height=&quot;60&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;t_ui&quot; value=&quot;Admin UI xem ngay lập tức&lt;br&gt;&lt;font color=&quot;#E3F2FD&quot; style=&quot;font-size: 10px;&quot;&gt;Review Queue Gen 2 mới nhất!&lt;/font&gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=50;fillColor=#2196F3;strokeColor=#ffffff;strokeWidth=2;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane_proj&quot;&gt;&lt;mxGeometry x=&quot;480&quot; y=&quot;390&quot; width=&quot;310&quot; height=&quot;60&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="960" height="540" fill="#14171d"/>

    <!-- Lane (y=20..510) -->
    <rect x="20" y="20" width="920" height="490" rx="8" ry="8" fill="#1e222b" stroke="#4CAF50" stroke-width="2"/>
    <rect x="20" y="20" width="920" height="28" rx="8" ry="8" fill="#2E7D32"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">🔄 LUỒNG CON D: BACKGROUND REVIEW PROJECTION &amp; GENERATION SWAP O(1)</text>

    <!-- Top Row: Done -> Enqueue -> Worker -->
    <g transform="translate(50, 70)">
      <rect x="0" y="0" width="230" height="55" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
      <text x="115" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Scan hoàn tất 100%</text>
      <text x="115" y="42" fill="#E8F5E9" font-family="sans-serif" font-size="10px" text-anchor="middle">(Status = COMPLETED)</text>
    </g>
    <path d="M 280 97 L 340 97" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="340,97 332,93 332,101" fill="#ffffff"/>

    <g transform="translate(340, 70)">
      <rect x="0" y="0" width="250" height="55" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
      <text x="125" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Đẩy 1 Task vào DB Table:</text>
      <text x="125" y="42" fill="#E3F2FD" font-family="sans-serif" font-size="10px" text-anchor="middle">scan_review_proj_task</text>
    </g>
    <path d="M 590 97 L 660 97" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="660,97 652,93 652,101" fill="#ffffff"/>

    <g transform="translate(660, 70)">
      <rect x="0" y="0" width="240" height="55" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Worker @Scheduled (1s)</text>
      <text x="120" y="42" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">Bốc Task xử lý ngầm độc lập</text>
    </g>

    <!-- Flow down to Row 2: Worker -> Build -> Lock -> Refresh -->
    <path d="M 780 125 L 780 170" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="780,170 776,162 784,162" fill="#ffffff"/>

    <g transform="translate(660, 170)">
      <rect x="0" y="0" width="240" height="65" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="26" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Dựng ngầm Thế Hệ 2 (Gen 2)</text>
      <text x="120" y="46" fill="#E0F2F1" font-family="sans-serif" font-size="9px" text-anchor="middle">INSERT review_proposal WHERE gen = 2</text>
    </g>
    <path d="M 660 202 L 590 202" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="590,202 598,198 598,206" fill="#ffffff"/>

    <g transform="translate(340, 170)">
      <rect x="0" y="0" width="250" height="65" rx="6" ry="6" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="125" y="26" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">lockRoot(rootKey)</text>
      <text x="125" y="46" fill="#FFCDD2" font-family="sans-serif" font-size="9px" text-anchor="middle">SELECT ... FOR UPDATE (Khóa độc quyền)</text>
    </g>
    <path d="M 340 202 L 280 202" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="280,202 288,198 288,206" fill="#ffffff"/>

    <g transform="translate(50, 170)">
      <rect x="0" y="0" width="230" height="65" rx="6" ry="6" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <text x="115" y="26" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Cập nhật quyết định cũ</text>
      <text x="115" y="46" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">Giữ nguyên các file đã duyệt từ trước</text>
    </g>

    <!-- Flow down to Swap O(1) -->
    <path d="M 165 235 L 165 290 L 460 290" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="460,290 452,286 452,294" fill="#4CAF50"/>

    <!-- Row 3: Swap O(1) -->
    <g transform="translate(150, 290)">
      <rect x="0" y="0" width="660" height="65" rx="10" ry="10" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
      <text x="330" y="26" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">⚡ TRÁO THẾ HỆ O(1) TỨC THÌ (&lt; 1ms)</text>
      <text x="330" y="46" fill="#E8F5E9" font-family="sans-serif" font-size="11px" text-anchor="middle">UPDATE projection_root SET current_gen = 2 WHERE root_key = :key</text>
    </g>

    <!-- Row 4: Branches from Swap -->
    <path d="M 330 355 L 330 410" fill="none" stroke="#78909C" stroke-width="1.5"/>
    <polygon points="330,410 326,402 334,402" fill="#78909C"/>

    <g transform="translate(150, 410)">
      <rect x="0" y="0" width="310" height="60" rx="6" ry="6" fill="#455A64" stroke="#ffffff" stroke-width="1.5"/>
      <text x="155" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Dọn rác thế hệ cũ (Chạy ngầm)</text>
      <text x="155" y="44" fill="#ECEFF1" font-family="sans-serif" font-size="9px" text-anchor="middle">DELETE FROM review_proposal WHERE gen &lt; 2</text>
    </g>

    <path d="M 630 355 L 630 410" fill="none" stroke="#2196F3" stroke-width="2"/>
    <polygon points="630,410 626,402 634,402" fill="#2196F3"/>

    <g transform="translate(500, 410)">
      <rect x="0" y="0" width="310" height="60" rx="30" ry="30" fill="#2196F3" stroke="#ffffff" stroke-width="2"/>
      <text x="155" y="24" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Admin UI xem ngay lập tức</text>
      <text x="155" y="44" fill="#E3F2FD" font-family="sans-serif" font-size="10px" text-anchor="middle">Review Queue Gen 2 mới nhất!</text>
    </g>

  </g>
</svg>
