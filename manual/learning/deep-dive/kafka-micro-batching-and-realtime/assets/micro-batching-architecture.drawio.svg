<?xml version="1.0" encoding="UTF-8"?>
<!-- Do not edit this file with editors other than draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1060px" height="580px" viewBox="-0.5 -0.5 1060 580" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram id=&quot;micro-batching-arch&quot; name=&quot;MicroBatchingVsRealtime&quot;&gt;&lt;mxGraphModel dx=&quot;1060&quot; dy=&quot;580&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; background=&quot;#14171d&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;lane1&quot; value=&quot;1. CLIENT &amp;amp; PRODUCER LAYER&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;fillColor=#1e222b;strokeColor=#2196F3;strokeWidth=2;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;530&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;user_req&quot; value=&quot;User Request (HTTP)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane1&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;50&quot; width=&quot;190&quot; height=&quot;45&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;app_svc&quot; value=&quot;App Service (API)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane1&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;140&quot; width=&quot;190&quot; height=&quot;50&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;producer_buf&quot; value=&quot;Producer RecordAccumulator&lt;br&gt;(linger.ms=5 | batch=64KB)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#009688;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;370&quot; width=&quot;200&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane2&quot; value=&quot;2. STORAGE &amp;amp; CDC (OUTBOX)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;fillColor=#1e222b;strokeColor=#9C27B0;strokeWidth=2;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;280&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;530&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;pg_db&quot; value=&quot;PostgreSQL (Local Tx)&lt;br&gt;Business + Outbox Table&quot; style=&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#9C27B0;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane2&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;130&quot; width=&quot;180&quot; height=&quot;75&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;wal_log&quot; value=&quot;Postgres WAL Stream&lt;br&gt;(Binary Disk Log)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#455A64;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane2&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;260&quot; width=&quot;180&quot; height=&quot;50&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;debezium&quot; value=&quot;Debezium / CDC Agent&lt;br&gt;(Sub-50ms tailing)&quot; style=&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#E91E63;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane2&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;370&quot; width=&quot;190&quot; height=&quot;80&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane3&quot; value=&quot;3. KAFKA BROKER (REAL-TIME STREAM)&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;fillColor=#1e222b;strokeColor=#009688;strokeWidth=2;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;530&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;530&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;kafka_topic&quot; value=&quot;Topic Partitions&lt;br&gt;(Partition 0..N)&quot; style=&quot;shape=hexagon;perimeter=hexagonPerimeter2;whiteSpace=wrap;html=1;size=0.15;fillColor=#009688;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane3&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;160&quot; width=&quot;180&quot; height=&quot;80&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;page_cache&quot; value=&quot;OS PageCache &amp;amp; Zero-Copy&lt;br&gt;(sendfile() direct socket)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#004D40;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane3&quot;&gt;&lt;mxGeometry x=&quot;25&quot; y=&quot;370&quot; width=&quot;180&quot; height=&quot;65&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;lane4&quot; value=&quot;4. CONSUMER &amp;amp; DISPATCHER&quot; style=&quot;swimlane;whiteSpace=wrap;html=1;fillColor=#1e222b;strokeColor=#4CAF50;strokeWidth=2;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;780&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;530&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;consumer_poll&quot; value=&quot;Consumer poll(batch)&lt;br&gt;(Fetch 500 records/round)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FF9800;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane4&quot;&gt;&lt;mxGeometry x=&quot;30&quot; y=&quot;160&quot; width=&quot;200&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;worker_pool&quot; value=&quot;Virtual Threads Pool&lt;br&gt;Parallel Dispatch by Key&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#4CAF50;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane4&quot;&gt;&lt;mxGeometry x=&quot;30&quot; y=&quot;280&quot; width=&quot;200&quot; height=&quot;60&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;ws_push&quot; value=&quot;WebSocket / SSE Push&lt;br&gt;(Instant User Notification)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2196F3;strokeColor=#ffffff;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;lane4&quot;&gt;&lt;mxGeometry x=&quot;30&quot; y=&quot;400&quot; width=&quot;200&quot; height=&quot;55&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Canvas Background -->
    <rect x="0" y="0" width="1060" height="580" fill="#14171d"/>

    <!-- ==================== SWIMLANE 1: CLIENT & PRODUCER LAYER ==================== -->
    <rect x="20" y="20" width="240" height="530" rx="8" ry="8" fill="#1e222b" stroke="#2196F3" stroke-width="2"/>
    <rect x="20" y="20" width="240" height="28" rx="8" ry="8" fill="#0D47A1"/>
    <text x="35" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. CLIENT &amp; PRODUCER</text>

    <!-- User Request Box -->
    <rect x="45" y="65" width="190" height="45" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="85" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">User Request</text>
    <text x="140" y="100" fill="#E3F2FD" font-family="sans-serif" font-size="10px" text-anchor="middle">(HTTP POST / Event Entry)</text>

    <!-- App Service Box -->
    <rect x="45" y="150" width="190" height="50" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="172" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">App Service (API)</text>
    <text x="140" y="188" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">HTTP 200/202 Response (&lt; 30ms)</text>

    <!-- Arrow 1: User -> App Service -->
    <path d="M 140 110 L 140 150" fill="none" stroke="#2196F3" stroke-width="2"/>
    <polygon points="140,150 136,142 144,142" fill="#2196F3"/>

    <!-- Producer Memory Buffer -->
    <rect x="40" y="380" width="200" height="65" rx="6" ry="6" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="402" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Producer Memory Buffer</text>
    <text x="140" y="418" fill="#E0F2F1" font-family="sans-serif" font-size="10px" text-anchor="middle">linger.ms=5 | batch.size=64KB</text>
    <text x="140" y="433" fill="#B2DFDB" font-family="sans-serif" font-size="9px" text-anchor="middle">⚡ Đầy trước 5ms -&gt; Gửi ngay lập tức</text>

    <!-- Direct Async Send Arrow -->
    <path d="M 140 200 L 140 380" fill="none" stroke="#009688" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="140,380 136,372 144,372" fill="#009688"/>
    <rect x="75" y="275" width="130" height="18" rx="3" fill="#1e222b" stroke="#009688" stroke-width="1"/>
    <text x="140" y="288" fill="#80CBC4" font-family="sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Async Send (Direct Path)</text>


    <!-- ==================== SWIMLANE 2: STORAGE & CDC (OUTBOX) ==================== -->
    <rect x="280" y="20" width="230" height="530" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="280" y="20" width="230" height="28" rx="8" ry="8" fill="#4A148C"/>
    <text x="295" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. STORAGE &amp; CDC (OUTBOX)</text>

    <!-- Cylinder Shape (Postgres DB) -->
    <g transform="translate(305, 140)">
      <path d="M 0 12 C 0 4, 180 4, 180 12 L 180 65 C 180 73, 0 73, 0 65 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="90" cy="12" rx="90" ry="10" fill="#BA68C8" stroke="#ffffff" stroke-width="1.5"/>
      <text x="90" y="38" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>
      <text x="90" y="52" fill="#F3E5F5" font-family="sans-serif" font-size="9px" text-anchor="middle">1 Tx: Business + outbox_event</text>
    </g>

    <!-- Arrow App -> DB Local Tx -->
    <path d="M 235 175 L 305 175" fill="none" stroke="#FF9800" stroke-width="2"/>
    <polygon points="305,175 297,171 297,179" fill="#FF9800"/>

    <!-- Postgres WAL Log -->
    <rect x="305" y="260" width="180" height="48" rx="6" ry="6" fill="#455A64" stroke="#ffffff" stroke-width="1.5"/>
    <text x="395" y="280" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">PostgreSQL WAL Log</text>
    <text x="395" y="295" fill="#CFD8DC" font-family="sans-serif" font-size="9px" text-anchor="middle">(Disk Append-Only Log Stream)</text>

    <!-- Arrow DB -> WAL -->
    <path d="M 395 215 L 395 260" fill="none" stroke="#9C27B0" stroke-width="2"/>
    <polygon points="395,260 391,252 399,252" fill="#9C27B0"/>

    <!-- Debezium CDC Engine (Rhombus) -->
    <g transform="translate(300, 375)">
      <polygon points="95,0 190,38 95,76 0,38" fill="#E91E63" stroke="#ffffff" stroke-width="1.5"/>
      <text x="95" y="34" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Debezium CDC Engine</text>
      <text x="95" y="49" fill="#FCE4EC" font-family="sans-serif" font-size="9px" text-anchor="middle">Tailing WAL Log (&lt; 20ms)</text>
    </g>

    <!-- Arrow WAL -> Debezium -->
    <path d="M 395 308 L 395 375" fill="none" stroke="#E91E63" stroke-width="2"/>
    <polygon points="395,375 391,367 399,367" fill="#E91E63"/>


    <!-- ==================== SWIMLANE 3: KAFKA BROKER STREAM ==================== -->
    <rect x="530" y="20" width="230" height="530" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="530" y="20" width="230" height="28" rx="8" ry="8" fill="#004D40"/>
    <text x="545" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">3. KAFKA BROKER REALM</text>

    <!-- Kafka Topic (Hexagon) -->
    <g transform="translate(550, 140)">
      <polygon points="25,0 165,0 190,40 165,80 25,80 0,40" fill="#009688" stroke="#ffffff" stroke-width="1.5"/>
      <text x="95" y="35" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Kafka Topic Stream</text>
      <text x="95" y="52" fill="#E0F2F1" font-family="sans-serif" font-size="10px" text-anchor="middle">Partition 0 .. Partition N</text>
    </g>

    <!-- Arrow Producer -> Kafka Topic -->
    <path d="M 240 412 Q 400 412 550 200" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="550,200 540,203 546,210" fill="#009688"/>

    <!-- Arrow Debezium -> Kafka Topic -->
    <path d="M 490 412 Q 520 412 570 220" fill="none" stroke="#E91E63" stroke-width="2"/>
    <polygon points="570,220 560,222 566,230" fill="#E91E63"/>

    <!-- Kafka PageCache / Zero-Copy -->
    <rect x="555" y="380" width="180" height="65" rx="6" ry="6" fill="#004D40" stroke="#ffffff" stroke-width="1.5"/>
    <text x="645" y="403" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">OS PageCache &amp; Zero-Copy</text>
    <text x="645" y="419" fill="#80CBC4" font-family="sans-serif" font-size="9px" text-anchor="middle">sendfile() direct socket I/O</text>
    <text x="645" y="433" fill="#B2DFDB" font-family="sans-serif" font-size="9px" text-anchor="middle">Không tốn CPU copy sang JVM</text>

    <!-- Arrow Topic -> PageCache -->
    <path d="M 645 220 L 645 380" fill="none" stroke="#009688" stroke-width="2"/>
    <polygon points="645,380 641,372 649,372" fill="#009688"/>


    <!-- ==================== SWIMLANE 4: CONSUMER & DISPATCHER ==================== -->
    <rect x="780" y="20" width="260" height="530" rx="8" ry="8" fill="#1e222b" stroke="#4CAF50" stroke-width="2"/>
    <rect x="780" y="20" width="260" height="28" rx="8" ry="8" fill="#1B5E20"/>
    <text x="795" y="39" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">4. CONSUMER &amp; WORKER POOL</text>

    <!-- Consumer poll() -->
    <rect x="805" y="150" width="210" height="55" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
    <text x="910" y="172" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Consumer poll(Batch)</text>
    <text x="910" y="188" fill="#FFF3E0" font-family="sans-serif" font-size="10px" text-anchor="middle">Lấy 500 records về RAM (1 Network I/O)</text>

    <!-- Arrow Kafka -> Consumer -->
    <path d="M 740 180 L 805 180" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="805,180 797,176 797,184" fill="#4CAF50"/>

    <!-- Worker Pool / Parallel Dispatch -->
    <rect x="805" y="270" width="210" height="65" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="1.5"/>
    <text x="910" y="292" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Virtual Threads / Dispatcher</text>
    <text x="910" y="308" fill="#E8F5E9" font-family="sans-serif" font-size="10px" text-anchor="middle">Xử lý song song từng event</text>
    <text x="910" y="323" fill="#C8E6C9" font-family="sans-serif" font-size="9px" text-anchor="middle">Bảo toàn thứ tự theo Partition Key</text>

    <!-- Arrow poll -> Worker Pool -->
    <path d="M 910 205 L 910 270" fill="none" stroke="#FF9800" stroke-width="2"/>
    <polygon points="910,270 906,262 914,262" fill="#FF9800"/>

    <!-- WebSocket / Push Notification -->
    <rect x="805" y="390" width="210" height="55" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
    <text x="910" y="412" fill="#ffffff" font-family="sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">WebSocket / SSE Push</text>
    <text x="910" y="428" fill="#E3F2FD" font-family="sans-serif" font-size="10px" text-anchor="middle">Bắn kết quả tức thì về User Device</text>

    <!-- Arrow Worker Pool -> WebSocket -->
    <path d="M 910 335 L 910 390" fill="none" stroke="#2196F3" stroke-width="2"/>
    <polygon points="910,390 906,382 914,382" fill="#2196F3"/>
  </g>
</svg>
