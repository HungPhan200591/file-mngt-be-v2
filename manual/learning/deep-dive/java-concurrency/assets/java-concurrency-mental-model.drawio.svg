<?xml version="1.0" encoding="UTF-8"?>
<!-- Do not edit this file with editors other than draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1120px" height="660px" viewBox="-0.5 -0.5 1120 660" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram id=&quot;java-concurrency-mindmap&quot; name=&quot;Java Concurrency Mental Model&quot;&gt;&lt;mxGraphModel dx=&quot;1120&quot; dy=&quot;660&quot; background=&quot;#14171d&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;c1&quot; value=&quot;1. EXECUTION REALM (Ai thực thi?)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#FF9800;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;340&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c2&quot; value=&quot;2. RESULTS &amp; PIPELINE (Lấy kết quả ra sao?)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#4CAF50;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;380&quot; y=&quot;20&quot; width=&quot;340&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c3&quot; value=&quot;3. SAFETY &amp; MEMORY (Bảo vệ dữ liệu thế nào?)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#9C27B0;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;740&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background Canvas -->
    <rect x="0" y="0" width="1120" height="660" fill="#14171d"/>

    <!-- ==================== REALM 1: EXECUTION ==================== -->
    <rect x="20" y="20" width="340" height="620" rx="8" ry="8" fill="#1e222b" stroke="#FF9800" stroke-width="2"/>
    <rect x="20" y="20" width="340" height="30" rx="8" ry="8" fill="#E65100"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. EXECUTION REALM (Ai thực thi?)</text>

    <!-- Node 1.1: Platform Thread -->
    <rect x="40" y="65" width="300" height="70" rx="6" ry="6" fill="#FF9800" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="90" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Platform Thread (OS Thread)</text>
    <text x="55" y="108" fill="#FFF3E0" font-family="sans-serif" font-size="10.5px">• Ánh xạ 1:1 Kernel OS (~1MB Stack RAM)</text>
    <text x="55" y="123" fill="#FFF3E0" font-family="sans-serif" font-size="10.5px">• Đắt đỏ, tối đa 1.000 - 5.000 luồng</text>

    <!-- Node 1.2: Virtual Thread -->
    <rect x="40" y="150" width="300" height="75" rx="6" ry="6" fill="#00BCD4" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="175" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Virtual Thread (Java 21+ Project Loom)</text>
    <text x="55" y="193" fill="#E0F7FA" font-family="sans-serif" font-size="10.5px">• Luồng ảo do JVM quản lý (~vài KB RAM)</text>
    <text x="55" y="208" fill="#E0F7FA" font-family="sans-serif" font-size="10.5px">• Hàng triệu luồng, tự unmount khi gặp I/O</text>

    <!-- Node 1.3: ExecutorService -->
    <rect x="40" y="240" width="300" height="65" rx="6" ry="6" fill="#2196F3" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="265" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">ExecutorService (Interface Quản Lý)</text>
    <text x="55" y="283" fill="#E3F2FD" font-family="sans-serif" font-size="10.5px">• Tách việc tạo Task (Callable/Runnable)</text>
    <text x="55" y="297" fill="#E3F2FD" font-family="sans-serif" font-size="10.5px">• Điều phối submit(), invokeAll(), shutdown()</text>

    <!-- Node 1.4: ThreadPoolExecutor -->
    <rect x="40" y="320" width="300" height="85" rx="6" ry="6" fill="#1565C0" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="343" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">ThreadPoolExecutor (Đội Hình Luồng)</text>
    <text x="55" y="360" fill="#E3F2FD" font-family="sans-serif" font-size="10.5px">• corePoolSize, maxPoolSize, keepAlive</text>
    <text x="55" y="375" fill="#E3F2FD" font-family="sans-serif" font-size="10.5px">• BlockingQueue (Hàng đợi công việc)</text>
    <text x="55" y="390" fill="#E3F2FD" font-family="sans-serif" font-size="10.5px">• RejectedExecutionHandler (Xử lý khi tràn)</text>

    <!-- Node 1.5: ForkJoinPool -->
    <rect x="40" y="420" width="300" height="70" rx="6" ry="6" fill="#00838F" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="445" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">ForkJoinPool &amp; Work-Stealing</text>
    <text x="55" y="463" fill="#E0F7FA" font-family="sans-serif" font-size="10.5px">• Chia để trị (Fork/Join) đa nhân CPU</text>
    <text x="55" y="478" fill="#E0F7FA" font-family="sans-serif" font-size="10.5px">• Nền tảng cho Carrier Threads &amp; parallelStream</text>

    <!-- Node 1.6: ScheduledExecutorService -->
    <rect x="40" y="505" width="300" height="60" rx="6" ry="6" fill="#455A64" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="530" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">ScheduledExecutorService</text>
    <text x="55" y="548" fill="#ECEFF1" font-family="sans-serif" font-size="10.5px">• Chạy định kỳ (fixedRate / fixedDelay / cron)</text>

    <!-- Connectors inside Realm 1 -->
    <path d="M 190 305 L 190 320" fill="none" stroke="#64B5F6" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 190 405 L 190 420" fill="none" stroke="#4DD0E1" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- ==================== REALM 2: RESULTS & PIPELINES ==================== -->
    <rect x="380" y="20" width="340" height="620" rx="8" ry="8" fill="#1e222b" stroke="#4CAF50" stroke-width="2"/>
    <rect x="380" y="20" width="340" height="30" rx="8" ry="8" fill="#2E7D32"/>
    <text x="395" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. RESULTS &amp; PIPELINES (Lấy kết quả ra sao?)</text>

    <!-- Node 2.1: Future (Legacy) -->
    <rect x="400" y="65" width="300" height="65" rx="6" ry="6" fill="#558B2F" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="90" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Future&lt;T&gt; (Java 5 Legacy)</text>
    <text x="415" y="108" fill="#F1F8E9" font-family="sans-serif" font-size="10.5px">• Chờ kết quả đồng bộ bằng .get() (Blocking)</text>
    <text x="415" y="122" fill="#F1F8E9" font-family="sans-serif" font-size="10.5px">• Không thể nối chuỗi (Chaining) hay gom nhóm</text>

    <!-- Node 2.2: CompletableFuture (Hero) -->
    <rect x="400" y="145" width="300" height="150" rx="6" ry="6" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
    <text x="415" y="172" fill="#ffffff" font-family="sans-serif" font-size="14px" font-weight="bold">CompletableFuture&lt;T&gt; (Promise)</text>
    <text x="415" y="192" fill="#E8F5E9" font-family="sans-serif" font-size="11px">• Hộp chứa kết quả Async Non-blocking I/O</text>
    <text x="415" y="208" fill="#E8F5E9" font-family="sans-serif" font-size="11px">• Gắn callback: thenApply(), thenAccept()</text>
    <text x="415" y="224" fill="#E8F5E9" font-family="sans-serif" font-size="11px">• Nối chuỗi &amp; gộp: thenCompose(), allOf()</text>
    <text x="415" y="240" fill="#E8F5E9" font-family="sans-serif" font-size="11px">• Bắt lỗi: exceptionally(), handle()</text>
    <text x="415" y="256" fill="#E8F5E9" font-family="sans-serif" font-size="11px">• Timeout guard: orTimeout(5, SECONDS)</text>
    <text x="415" y="278" fill="#C8E6C9" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Dùng trong: Kafka Publisher &amp; Microservices</text>

    <!-- Node 2.3: CompletionStage Interface -->
    <rect x="400" y="310" width="300" height="65" rx="6" ry="6" fill="#388E3C" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="335" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">CompletionStage&lt;T&gt; (Interface)</text>
    <text x="415" y="353" fill="#E8F5E9" font-family="sans-serif" font-size="10.5px">• Bản hợp đồng chuẩn cho Async Pipeline</text>
    <text x="415" y="367" fill="#E8F5E9" font-family="sans-serif" font-size="10.5px">• Che giấu implementation của tầng Message I/O</text>

    <!-- Node 2.4: Structured Concurrency -->
    <rect x="400" y="390" width="300" height="110" rx="6" ry="6" fill="#1B5E20" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="415" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Structured Concurrency (Java 21+)</text>
    <text x="415" y="433" fill="#C8E6C9" font-family="sans-serif" font-size="11px" font-weight="bold">StructuredTaskScope.ShutdownOnFailure</text>
    <text x="415" y="450" fill="#E8F5E9" font-family="sans-serif" font-size="10.5px">• Quản lý task con theo cấu trúc khối code</text>
    <text x="415" y="465" fill="#E8F5E9" font-family="sans-serif" font-size="10.5px">• 1 task con lỗi ➔ Tự động hủy các task còn lại</text>
    <text x="415" y="480" fill="#E8F5E9" font-family="sans-serif" font-size="10.5px">• Xóa bỏ vĩnh viễn nguy cơ "Luồng mồ côi"</text>

    <!-- Node 2.5: Reactive Streams -->
    <rect x="400" y="515" width="300" height="60" rx="6" ry="6" fill="#33691E" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="540" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">Reactive Streams (WebFlux / Reactor)</text>
    <text x="415" y="558" fill="#F1F8E9" font-family="sans-serif" font-size="10.5px">• Flux / Mono: Dòng dữ liệu đẩy (Backpressure)</text>

    <!-- ==================== REALM 3: SAFETY & MEMORY ==================== -->
    <rect x="740" y="20" width="360" height="620" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="740" y="20" width="360" height="30" rx="8" ry="8" fill="#4A148C"/>
    <text x="755" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">3. SAFETY, LOCKS &amp; MEMORY (Bảo vệ dữ liệu?)</text>

    <!-- Group 3.1: Locks -->
    <rect x="755" y="65" width="330" height="150" rx="6" ry="6" fill="#6A1B9A" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="88" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">🔒 Đồng bộ &amp; Khóa (Synchronization &amp; Locks)</text>
    <text x="770" y="108" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">synchronized</tspan>: Khóa nguyên thủy của Java</text>
    <text x="770" y="125" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">ReentrantLock</tspan>: tryLock(), timeout, fair lock</text>
    <text x="770" y="142" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">Semaphore(N)</tspan>: Giới hạn N luồng truy cập</text>
    <text x="770" y="159" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">CountDownLatch(N)</tspan>: Chờ N luồng đếm ngược</text>
    <text x="770" y="176" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">CyclicBarrier</tspan>: Điểm tập kết nhiều luồng lặp lại</text>
    <text x="770" y="198" fill="#E1BEE7" font-family="sans-serif" font-size="10.5px" font-weight="bold">⚠️ Với Virtual Threads: Ưu tiên ReentrantLock / Semaphore</text>

    <!-- Group 3.2: Atomics & Collections -->
    <rect x="755" y="230" width="330" height="140" rx="6" ry="6" fill="#8E24AA" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="253" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">📦 Dữ Liệu Lock-Free &amp; Hàng Đợi (Collections)</text>
    <text x="770" y="273" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">AtomicInteger, AtomicLong</tspan>: CAS phần cứng</text>
    <text x="770" y="290" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">LongAdder</tspan>: Siêu tối ưu khi đa luồng cùng ghi</text>
    <text x="770" y="307" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">ConcurrentHashMap</tspan>: Đọc ghi song song nhiều ô</text>
    <text x="770" y="324" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">ArrayBlockingQueue / LinkedTransferQueue</tspan></text>
    <text x="770" y="342" fill="#E1BEE7" font-family="sans-serif" font-size="10.5px">  ➔ Trái tim của mô hình Producer - Consumer</text>

    <!-- Group 3.3: Memory Visibility & Isolation -->
    <rect x="755" y="385" width="330" height="135" rx="6" ry="6" fill="#AB47BC" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="408" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">👤 Bộ Nhớ &amp; Phân Vùng Luồng (Isolation)</text>
    <text x="770" y="428" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">volatile</tspan>: Đọc/ghi thẳng RAM, nhìn thấy tức thì</text>
    <text x="770" y="445" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">ThreadLocal</tspan>: Túi đồ cá nhân của 1 OS Thread</text>
    <text x="770" y="462" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">ScopedValue (Java 21+)</tspan>: Túi đồ bất biến siêu nhẹ,</text>
    <text x="770" y="478" fill="#F3E5F5" font-family="sans-serif" font-size="10.5px">  thay thế ThreadLocal khi dùng với Virtual Threads</text>
    <text x="770" y="498" fill="#EDE7F6" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Dùng cho: TraceId, SecurityContext, CorrelationId</text>

    <!-- Cross Realm Relationships / Inter-links -->
    <!-- Link: Executor to CompletableFuture -->
    <path d="M 340 350 L 400 230" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="400,230 391,227 394,235" fill="#4CAF50"/>
    <rect x="345" y="275" width="60" height="18" rx="3" fill="#1e222b" stroke="#4CAF50" stroke-width="1"/>
    <text x="375" y="288" fill="#81C784" font-family="sans-serif" font-size="9.5px" font-weight="bold" text-anchor="middle">cung cấp pool</text>

    <!-- Link: CompletableFuture to BlockingQueue / Kafka -->
    <path d="M 700 230 L 755 300" fill="none" stroke="#BA68C8" stroke-width="2"/>
    <polygon points="755,300 746,297 749,305" fill="#BA68C8"/>
    <rect x="690" y="255" width="60" height="18" rx="3" fill="#1e222b" stroke="#BA68C8" stroke-width="1"/>
    <text x="720" y="268" fill="#CE93D8" font-family="sans-serif" font-size="9.5px" font-weight="bold" text-anchor="middle">đệm I/O</text>

    <!-- Link: Virtual Threads to ScopedValue -->
    <path d="M 340 185 L 755 450" fill="none" stroke="#00BCD4" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="755,450 745,446 748,454" fill="#00BCD4"/>
    <rect x="520" y="300" width="80" height="18" rx="3" fill="#1e222b" stroke="#00BCD4" stroke-width="1"/>
    <text x="560" y="313" fill="#80DEEA" font-family="sans-serif" font-size="9.5px" font-weight="bold" text-anchor="middle">đi kèm tối ưu</text>
  </g>
</svg>
