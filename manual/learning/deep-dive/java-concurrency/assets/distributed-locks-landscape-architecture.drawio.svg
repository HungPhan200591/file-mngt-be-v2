<?xml version="1.0" encoding="UTF-8"?>
<!-- Do not edit this file with editors other than draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1160px" height="680px" viewBox="-0.5 -0.5 1160 680" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram id=&quot;dist-locks-landscape&quot; name=&quot;Distributed Locks Landscape &amp; Architecture&quot;&gt;&lt;mxGraphModel dx=&quot;1160&quot; dy=&quot;680&quot; background=&quot;#14171d&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;c1&quot; value=&quot;1. IN-PROCESS JVM LOCKS (Trong 1 Bộ Nhớ RAM)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#E91E63;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;630&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c2&quot; value=&quot;2. DATABASE LEASE (PostgreSQL Source of Truth)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#9C27B0;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;390&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;630&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c3&quot; value=&quot;3. IN-MEMORY LOCK (Redis / Redisson / Redlock)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#FF9800;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;770&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;630&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background Canvas -->
    <rect x="0" y="0" width="1160" height="680" fill="#14171d"/>

    <!-- ==================== REALM 1: IN-PROCESS LOCKS ==================== -->
    <rect x="20" y="20" width="350" height="640" rx="8" ry="8" fill="#1e222b" stroke="#E91E63" stroke-width="2"/>
    <rect x="20" y="20" width="350" height="30" rx="8" ry="8" fill="#AD1457"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. IN-PROCESS LOCKS (Trong 1 JVM Heap)</text>

    <!-- Node 1.1: Core Primitive -->
    <rect x="38" y="65" width="314" height="150" rx="6" ry="6" fill="#880E4F" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="88" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Cơ chế Khóa Nội bộ Tiến trình</text>
    <text x="50" y="108" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• synchronized (JVM Monitor Object Header)</text>
    <text x="50" y="125" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• ReentrantLock / StampedLock (AQS on Heap)</text>
    <text x="50" y="142" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Atomic* (Chỉ thị CPU Hardware CAS)</text>
    <text x="50" y="160" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Tốc độ: Siêu nhanh (~vài nano-giây)</text>
    <text x="50" y="180" fill="#FF80AB" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Giới hạn: Chỉ bảo vệ trong 1 Server / 1 JVM</text>

    <!-- Node 1.2: Multi-node Challenge -->
    <rect x="38" y="230" width="314" height="175" rx="6" ry="6" fill="#C2185B" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="255" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Khi Scale Nhiều Node Microservices</text>
    <text x="50" y="275" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Instance A và Instance B có 2 RAM tách biệt</text>
    <text x="50" y="292" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• synchronized trên Node A KHÔNG bảo vệ Node B</text>
    <text x="50" y="309" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Tranh chấp dữ liệu Outbox, Scan proposal</text>
    <text x="50" y="326" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Cần cơ chế Điều phối Khóa Phân Tán</text>
    <text x="50" y="346" fill="#FF80AB" font-family="sans-serif" font-size="10.5px" font-weight="bold">💥 Bắt buộc chuyển sang Realm 2 hoặc Realm 3</text>

    <!-- Node 1.3: Best for -->
    <rect x="38" y="420" width="314" height="220" rx="6" ry="6" fill="#2D1225" stroke="#E91E63" stroke-width="1.5"/>
    <text x="50" y="445" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">Sử dụng trong Backend V2:</text>
    <text x="50" y="468" fill="#F8BBD0" font-family="sans-serif" font-size="11px">✅ ScanRunSseSession (SSE subscriber queue)</text>
    <text x="50" y="488" fill="#F8BBD0" font-family="sans-serif" font-size="11px">✅ ElasticsearchSearchAdapter (ReentrantLock)</text>
    <text x="50" y="508" fill="#F8BBD0" font-family="sans-serif" font-size="11px">✅ OutboxPressureGate (In-memory backpressure)</text>
    <text x="50" y="528" fill="#F8BBD0" font-family="sans-serif" font-size="11px">✅ ArrayBlockingQueue (Cursor batch paging)</text>
    <text x="50" y="555" fill="#FF4081" font-family="sans-serif" font-size="11px" font-weight="bold">🔒 Không chạm network, an toàn tuyệt đối</text>

    <!-- ==================== REALM 2: POSTGRESQL LEASE ==================== -->
    <rect x="390" y="20" width="360" height="640" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2.5"/>
    <rect x="390" y="20" width="360" height="30" rx="8" ry="8" fill="#4A148C"/>
    <text x="405" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. DATABASE LEASE (PostgreSQL Source of Truth)</text>

    <!-- Cylinder Shape: PostgreSQL -->
    <g transform="translate(420, 65)">
      <path d="M 0 12 C 0 4, 300 4, 300 12 L 300 70 C 300 78, 0 78, 0 70 Z" fill="#6A1B9A" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="150" cy="12" rx="150" ry="10" fill="#AB47BC" stroke="#ffffff" stroke-width="1.5"/>
      <text x="150" y="40" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold" text-anchor="middle">PostgreSQL Database Engine</text>
      <text x="150" y="58" fill="#F3E5F5" font-family="sans-serif" font-size="10.5px" text-anchor="middle">Row-Level Locks + WAL Durable Disk</text>
    </g>

    <!-- Node 2.1: Key Mechanism -->
    <rect x="410" y="160" width="320" height="235" rx="6" ry="6" fill="#4A148C" stroke="#ffffff" stroke-width="1.5"/>
    <text x="425" y="185" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Cơ chế Khóa PostgreSQL-backed Lease</text>
    <text x="425" y="205" fill="#E1BEE7" font-family="sans-serif" font-size="11px">1. <tspan font-weight="bold">SELECT ... FOR UPDATE SKIP LOCKED</tspan></text>
    <text x="425" y="222" fill="#E1BEE7" font-family="sans-serif" font-size="11px">   ➔ Bỏ qua dòng đang bị khóa, 0s nghẽn CPU</text>
    <text x="425" y="242" fill="#E1BEE7" font-family="sans-serif" font-size="11px">2. <tspan font-weight="bold">Atomic Claim &amp; State Update</tspan></text>
    <text x="425" y="259" fill="#E1BEE7" font-family="sans-serif" font-size="11px">   ➔ Claim job và đổi RUNNING trong 1 Transaction</text>
    <text x="425" y="279" fill="#E1BEE7" font-family="sans-serif" font-size="11px">3. <tspan font-weight="bold">Dead Worker Auto-Recovery</tspan></text>
    <text x="425" y="296" fill="#E1BEE7" font-family="sans-serif" font-size="11px">   ➔ lease_until &lt; NOW() tự gắp lại việc mồ côi</text>
    <text x="425" y="316" fill="#E1BEE7" font-family="sans-serif" font-size="11px">4. <tspan font-weight="bold">Zero Dual-Write</tspan></text>
    <text x="425" y="333" fill="#E1BEE7" font-family="sans-serif" font-size="11px">   ➔ Không lệch trạng thái giữa Cache và DB</text>
    <text x="425" y="358" fill="#E040FB" font-family="sans-serif" font-size="11px" font-weight="bold">🏆 Chuẩn mực tuyệt đối cho Correctness</text>

    <!-- Node 2.2: Applied in BE V2 -->
    <rect x="410" y="410" width="320" height="230" rx="6" ry="6" fill="#20102B" stroke="#BA68C8" stroke-width="1.5"/>
    <text x="425" y="435" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">Triển khai trong Backend V2:</text>
    <text x="425" y="458" fill="#E1BEE7" font-family="sans-serif" font-size="11px">✅ CatalogOutboxEventRepository</text>
    <text x="425" y="478" fill="#E1BEE7" font-family="sans-serif" font-size="11px">✅ ScanOutboxEventRepository</text>
    <text x="425" y="498" fill="#E1BEE7" font-family="sans-serif" font-size="11px">✅ ApprovalOperationRepository</text>
    <text x="425" y="518" fill="#E1BEE7" font-family="sans-serif" font-size="11px">✅ BulkDecisionJobRepository</text>
    <text x="425" y="545" fill="#EA80FC" font-family="sans-serif" font-size="10.5px">🛡️ Bảo vệ: Dữ liệu Outbox, Scan Import, Duyệt</text>

    <!-- ==================== REALM 3: REDIS / REDLOCK ==================== -->
    <rect x="770" y="20" width="370" height="640" rx="8" ry="8" fill="#1e222b" stroke="#FF9800" stroke-width="2"/>
    <rect x="770" y="20" width="370" height="30" rx="8" ry="8" fill="#E65100"/>
    <text x="785" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">3. IN-MEMORY LOCK (Redis / Redisson / Redlock)</text>

    <!-- Node 3.1: Redis Lock Concept -->
    <rect x="790" y="65" width="330" height="150" rx="6" ry="6" fill="#EF6C00" stroke="#ffffff" stroke-width="1.5"/>
    <text x="805" y="88" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Cơ chế Redis Distributed Lock</text>
    <text x="805" y="108" fill="#FFF3E0" font-family="sans-serif" font-size="11px">• SET lock_key token NX PX 30000</text>
    <text x="805" y="125" fill="#FFF3E0" font-family="sans-serif" font-size="11px">• Redisson Watchdog (Netty Timer gia hạn TTL)</text>
    <text x="805" y="142" fill="#FFF3E0" font-family="sans-serif" font-size="11px">• Antirez Redlock (Khóa đa số trên 5 nodes)</text>
    <text x="805" y="160" fill="#FFF3E0" font-family="sans-serif" font-size="11px">• Ưu điểm: Throughput cực khủng (>100k TPS)</text>
    <text x="805" y="180" fill="#FFE082" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Tối ưu tài nguyên CPU / Tránh trùng việc</text>

    <!-- Node 3.2: Martin Kleppmann Critiques -->
    <rect x="790" y="230" width="330" height="185" rx="6" ry="6" fill="#BF360C" stroke="#ffffff" stroke-width="2"/>
    <text x="805" y="255" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">⚠️ Cảnh báo của Martin Kleppmann (DDIA)</text>
    <text x="805" y="275" fill="#FFCCBC" font-family="sans-serif" font-size="11px">1. <tspan font-weight="bold">JVM GC Pause</tspan>: Freeze luồng ➔ Mất lock ➔ Ghi đè</text>
    <text x="805" y="295" fill="#FFCCBC" font-family="sans-serif" font-size="11px">2. <tspan font-weight="bold">Async Replication</tspan>: Master crash ➔ Cấp trùng lock</text>
    <text x="805" y="315" fill="#FFCCBC" font-family="sans-serif" font-size="11px">3. <tspan font-weight="bold">Clock Drift NTP</tspan>: Lệch giờ vật lý ➔ Hết hạn sớm</text>
    <text x="805" y="335" fill="#FFCCBC" font-family="sans-serif" font-size="11px">4. <tspan font-weight="bold">Fencing Token</tspan>: Bắt buộc DB phải tự kiểm tra</text>
    <text x="805" y="358" fill="#FFAB91" font-family="sans-serif" font-size="10.5px" font-weight="bold">🛑 KHÔNG DÙNG CHO DỮ LIỆU TÀI CHÍNH / STATE LÕI</text>

    <!-- Node 3.3: When to relax / Use Redis -->
    <rect x="790" y="430" width="330" height="210" rx="6" ry="6" fill="#2E1C0C" stroke="#FF9800" stroke-width="1.5"/>
    <text x="805" y="455" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">Khi nào NÊN nới lỏng để dùng Redis?</text>
    <text x="805" y="478" fill="#FFE082" font-family="sans-serif" font-size="11px">⚡ Rate Limiting / Token Bucket (Gateway)</text>
    <text x="805" y="498" fill="#FFE082" font-family="sans-serif" font-size="11px">⚡ Flash-Sale / High-TPS In-Memory Counter</text>
    <text x="805" y="518" fill="#FFE082" font-family="sans-serif" font-size="11px">⚡ Realtime Leaderboard (Redis Sorted Set - ZSET)</text>
    <text x="805" y="538" fill="#FFE082" font-family="sans-serif" font-size="11px">⚡ WebSocket Presence / Online-Offline TTL</text>
    <text x="805" y="565" fill="#FFD54F" font-family="sans-serif" font-size="10.5px" font-weight="bold">💡 Dữ liệu tạm thời (Ephemeral) &amp; Throughput lớn</text>
  </g>
</svg>
