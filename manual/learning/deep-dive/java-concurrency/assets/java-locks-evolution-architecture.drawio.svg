<?xml version="1.0" encoding="UTF-8"?>
<!-- Do not edit this file with editors other than draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1120px" height="660px" viewBox="-0.5 -0.5 1120 660" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram id=&quot;java-locks-evolution&quot; name=&quot;Java Locks Evolution &amp; Architecture&quot;&gt;&lt;mxGraphModel dx=&quot;1120&quot; dy=&quot;660&quot; background=&quot;#14171d&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;c1&quot; value=&quot;1. EXCLUSIVE MUTEX (Khóa Độc Quyền)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#E91E63;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;20&quot; y=&quot;20&quot; width=&quot;340&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c2&quot; value=&quot;2. READ/WRITE &amp; OPTIMISTIC (Khóa Phân Luồng &amp; Lạc Quan)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#009688;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;380&quot; y=&quot;20&quot; width=&quot;340&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;c3&quot; value=&quot;3. COORDINATION &amp; BARRIERS (Điều Phối &amp; Hạn Mức)&quot; style=&quot;swimlane;fillColor=#1e222b;strokeColor=#9C27B0;startSize=28;fontColor=#ffffff;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;740&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;600&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Background Canvas -->
    <rect x="0" y="0" width="1120" height="660" fill="#14171d"/>

    <!-- ==================== REALM 1: EXCLUSIVE MUTEX ==================== -->
    <rect x="20" y="20" width="340" height="620" rx="8" ry="8" fill="#1e222b" stroke="#E91E63" stroke-width="2"/>
    <rect x="20" y="20" width="340" height="30" rx="8" ry="8" fill="#AD1457"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">1. EXCLUSIVE MUTEX (Khóa Độc Quyền)</text>

    <!-- Node 1.1: synchronized -->
    <rect x="40" y="65" width="300" height="135" rx="6" ry="6" fill="#C2185B" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="88" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">synchronized (Java 1.0 Keyword)</text>
    <text x="55" y="108" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Quản lý bởi JVM Bytecode (monitorenter)</text>
    <text x="55" y="125" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Tự động giải phóng 100%, không sợ quên</text>
    <text x="55" y="142" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• JIT: Lock Elimination &amp; Biased Locking</text>
    <text x="55" y="160" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• ⚠️ Java 21 Virtual Threads: Gây Pinning</text>
    <text x="55" y="180" fill="#FF80AB" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Dùng cho: 80% tác vụ khóa RAM ngắn gọn</text>

    <!-- Node 1.2: ReentrantLock -->
    <rect x="40" y="220" width="300" height="180" rx="6" ry="6" fill="#D81B60" stroke="#ffffff" stroke-width="2"/>
    <text x="55" y="245" fill="#ffffff" font-family="sans-serif" font-size="14px" font-weight="bold">ReentrantLock (Java 5 - JSR 166)</text>
    <text x="55" y="265" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Triển khai bằng Pure Java trên nền AQS</text>
    <text x="55" y="282" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• tryLock(timeout): Chống Deadlock</text>
    <text x="55" y="299" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• lockInterruptibly(): Cho phép hủy luồng</text>
    <text x="55" y="316" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• new ReentrantLock(true): Khóa công bằng</text>
    <text x="55" y="333" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• newCondition(): Nhiều hàng đợi điều kiện</text>
    <text x="55" y="350" fill="#FCE4EC" font-family="sans-serif" font-size="11px">• Bắt buộc: try { ... } finally { unlock(); }</text>
    <text x="55" y="372" fill="#FF80AB" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Tương thích 100% với Virtual Threads</text>

    <!-- Node 1.3: Comparison Summary -->
    <rect x="40" y="420" width="300" height="135" rx="6" ry="6" fill="#880E4F" stroke="#ffffff" stroke-width="1.5"/>
    <text x="55" y="445" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">Khác biệt Cốt lõi (Core Differentiator)</text>
    <text x="55" y="465" fill="#F8BBD0" font-family="sans-serif" font-size="10.5px">• <tspan font-weight="bold">Reentrancy</tspan>: Cả 2 đều cho phép 1 luồng</text>
    <text x="55" y="480" fill="#F8BBD0" font-family="sans-serif" font-size="10.5px">  tự vào lại hàm có cùng khóa nhiều lần.</text>
    <text x="55" y="498" fill="#F8BBD0" font-family="sans-serif" font-size="10.5px">• <tspan font-weight="bold">Flexibility</tspan>: ReentrantLock khóa vắt qua</text>
    <text x="55" y="513" fill="#F8BBD0" font-family="sans-serif" font-size="10.5px">  nhiều hàm (Hand-over-hand locking).</text>

    <!-- ==================== REALM 2: READ/WRITE & OPTIMISTIC ==================== -->
    <rect x="380" y="20" width="340" height="620" rx="8" ry="8" fill="#1e222b" stroke="#009688" stroke-width="2"/>
    <rect x="380" y="20" width="340" height="30" rx="8" ry="8" fill="#004D40"/>
    <text x="395" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">2. READ/WRITE &amp; OPTIMISTIC (Đọc/Ghi &amp; Lạc Quan)</text>

    <!-- Node 2.1: ReentrantReadWriteLock -->
    <rect x="400" y="65" width="300" height="150" rx="6" ry="6" fill="#00796B" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="90" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">ReentrantReadWriteLock (Java 5)</text>
    <text x="415" y="110" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Tách riêng: ReadLock vs WriteLock</text>
    <text x="415" y="127" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Nhiều luồng cùng giữ ReadLock đồng thời</text>
    <text x="415" y="144" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Chỉ 1 luồng được giữ WriteLock (Độc quyền)</text>
    <text x="415" y="161" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Hỗ trợ: Lock Downgrading (Write ➔ Read)</text>
    <text x="415" y="178" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• ⚠️ Nhược điểm: Bị Write Starvation</text>
    <text x="415" y="198" fill="#A7FFEB" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Phù hợp: Đọc nhiều (80%), Ghi ít (20%)</text>

    <!-- Node 2.2: StampedLock (The Beast) -->
    <rect x="400" y="235" width="300" height="210" rx="6" ry="6" fill="#00897B" stroke="#ffffff" stroke-width="2"/>
    <text x="415" y="260" fill="#ffffff" font-family="sans-serif" font-size="14px" font-weight="bold">StampedLock (Java 8 - Đọc Lạc Quan)</text>
    <text x="415" y="280" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Cơ chế "Tem Phiếu" (Stamp trả về kiểu long)</text>
    <text x="415" y="297" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">tryOptimisticRead()</tspan>: ĐỌC KHÔNG CẦN LOCK!</text>
    <text x="415" y="314" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• <tspan font-weight="bold">validate(stamp)</tspan>: Kiểm tra tem có rách?</text>
    <text x="415" y="331" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Tốc độ đọc: Tương đương đọc RAM thô</text>
    <text x="415" y="348" fill="#E0F2F1" font-family="sans-serif" font-size="11px">• Không bao giờ bị Write Starvation</text>
    <text x="415" y="365" fill="#FF8A80" font-family="sans-serif" font-size="11px">• 🛑 <tspan font-weight="bold">KHÔNG REENTRANT</tspan>: Tự deadlock nếu khóa 2 lần</text>
    <text x="415" y="382" fill="#FF8A80" font-family="sans-serif" font-size="11px">• 🛑 Không dùng Thread.interrupt() khi chờ</text>
    <text x="415" y="405" fill="#A7FFEB" font-family="sans-serif" font-size="10.5px" font-weight="bold">👉 Dùng cho: Core Engine, In-Memory Caches</text>

    <!-- Node 2.3: StampedLock vs ReadWriteLock -->
    <rect x="400" y="465" width="300" height="90" rx="6" ry="6" fill="#004D40" stroke="#ffffff" stroke-width="1.5"/>
    <text x="415" y="490" fill="#ffffff" font-family="sans-serif" font-size="12.5px" font-weight="bold">So Sánh: ReadWriteLock vs StampedLock</text>
    <text x="415" y="508" fill="#B2DFDB" font-family="sans-serif" font-size="10.5px">• ReadWriteLock: Luồng đọc vẫn phải đổi State</text>
    <text x="415" y="525" fill="#B2DFDB" font-family="sans-serif" font-size="10.5px">• StampedLock: Luồng đọc không đổi 1 bit State!</text>

    <!-- ==================== REALM 3: COORDINATION & BARRIERS ==================== -->
    <rect x="740" y="20" width="360" height="620" rx="8" ry="8" fill="#1e222b" stroke="#9C27B0" stroke-width="2"/>
    <rect x="740" y="20" width="360" height="30" rx="8" ry="8" fill="#4A148C"/>
    <text x="755" y="40" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">3. COORDINATION &amp; BARRIERS (Điều Phối &amp; Hạn Mức)</text>

    <!-- Node 3.1: Semaphore -->
    <rect x="755" y="65" width="330" height="95" rx="6" ry="6" fill="#6A1B9A" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="88" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Semaphore(N) — "Vé Ra Vào Bãi Giữ Xe"</text>
    <text x="770" y="108" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Quản lý N giấy phép (Permits) đồng thời</text>
    <text x="770" y="125" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• acquire(): Lấy 1 vé (Hết vé thì đứng chờ)</text>
    <text x="770" y="142" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• release(): Trả lại vé cho luồng khác</text>
    <text x="770" y="153" fill="#E1BEE7" font-family="sans-serif" font-size="10px" font-weight="bold">👉 Dùng giới hạn kết nối DB cho Virtual Threads</text>

    <!-- Node 3.2: CountDownLatch -->
    <rect x="755" y="175" width="330" height="95" rx="6" ry="6" fill="#7B1FA2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="198" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">CountDownLatch(N) — "Đếm Lùi Xuất Phát"</text>
    <text x="770" y="218" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Bộ đếm lùi một chiều từ N về 0</text>
    <text x="770" y="235" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• await(): Luồng chính đứng đợi N tác vụ con</text>
    <text x="770" y="252" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• countDown(): Giảm đếm 1 đơn vị khi xong</text>
    <text x="770" y="263" fill="#E1BEE7" font-family="sans-serif" font-size="10px" font-weight="bold">👉 Dùng một lần duy nhất (Không tái sử dụng được)</text>

    <!-- Node 3.3: CyclicBarrier -->
    <rect x="755" y="285" width="330" height="95" rx="6" ry="6" fill="#8E24AA" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="308" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">CyclicBarrier(N) — "Điểm Hẹn Tập Kết"</text>
    <text x="770" y="328" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Chờ N luồng cùng đến vạch xuất phát</text>
    <text x="770" y="345" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• await(): Luồng nào đến trước phải đợi luồng sau</text>
    <text x="770" y="362" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Tự động Reset sau mỗi vòng lặp</text>
    <text x="770" y="373" fill="#E1BEE7" font-family="sans-serif" font-size="10px" font-weight="bold">👉 Phù hợp: Tính toán thuật toán ma trận lặp</text>

    <!-- Node 3.4: Phaser -->
    <rect x="755" y="395" width="330" height="85" rx="6" ry="6" fill="#AB47BC" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="418" fill="#ffffff" font-family="sans-serif" font-size="13px" font-weight="bold">Phaser (Java 7 — Rào Chắn Linh Hoạt)</text>
    <text x="770" y="438" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Nâng cấp của CountDownLatch + CyclicBarrier</text>
    <text x="770" y="455" fill="#F3E5F5" font-family="sans-serif" font-size="11px">• Cho phép luồng đăng ký/rời bỏ động (Dynamic)</text>
    <text x="770" y="472" fill="#EDE7F6" font-family="sans-serif" font-size="10px" font-weight="bold">👉 Dùng cho: Luồng công việc phân giai đoạn động</text>

    <!-- Summary Box bottom -->
    <rect x="755" y="495" width="330" height="60" rx="6" ry="6" fill="#4A148C" stroke="#ffffff" stroke-width="1.5"/>
    <text x="770" y="520" fill="#ffffff" font-family="sans-serif" font-size="12px" font-weight="bold">Kim Chỉ Nam:</text>
    <text x="770" y="540" fill="#E1BEE7" font-family="sans-serif" font-size="10.5px">Semaphore = Giới hạn; Latch = Đợi; Barrier = Đồng bộ</text>
  </g>
</svg>
