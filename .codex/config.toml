# MCP PostgreSQL local cho Backend V2.
# Credential được đọc từ .env bởi script launcher; không lưu secret trong file này.

model_reasoning_summary = "auto"
sandbox_mode = "workspace-write"
[mcp_servers.catalog_postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://catalog_user:change-me-catalog@localhost:18110/catalog_db"]
enabled_tools = ["query"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.scan_postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://scan_user:change-me-scan@localhost:18110/scan_db"]
enabled_tools = ["query"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.query_postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://query_user:change-me-query@localhost:18110/query_db"]
enabled_tools = ["query"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[sandbox_workspace_write]
network_access = true
